<!doctype html>
<html lang="en">
<head>
<script src="../site-glue.js" data-game="eyeball-it"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Eyeball It!: perception test game | Infinite Games</title><meta name="description" content="Five quick tests of how well your eyes judge angles, colors, counts and sizes. No rulers, just your eyes. Free to play in your browser."><link rel="canonical" href="https://grantdilli.github.io/games/eyeball-it/">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root{--text:#3b2a5c;--muted:#7a6f9c;--accent:#ff5fa2;--accent-dk:#d93f82;--good:#2fbf8f;
    --display:"Fredoka","Nunito",system-ui,sans-serif;--body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#efe9ff;color:var(--text);font-family:var(--body);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;
    padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left))}
  .chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
  .chip{background:rgba(255,255,255,.9);color:var(--muted);font-weight:700;border-radius:999px;padding:5px 15px;box-shadow:0 3px 0 rgba(80,60,160,.14);white-space:nowrap;font-variant-numeric:tabular-nums}
  .chip b{color:var(--text);font-weight:800}
  .pips{display:inline-flex;gap:4px;vertical-align:middle;margin-left:6px}
  .pips i{width:10px;height:10px;border-radius:50%;background:#e4dcff;display:block}
  .pips i.on{background:var(--accent)}.pips i.done{background:#b39cff}
  .icons{display:flex;gap:8px;flex:none}
  .hud button{pointer-events:auto}
  button{font:600 1.05rem var(--display);border:0;cursor:pointer;border-radius:999px;transition:transform .08s,box-shadow .08s,opacity .2s;color:inherit}
  button.icon{width:44px;height:44px;padding:0;display:grid;place-items:center;background:rgba(255,255,255,.94);color:var(--text);box-shadow:0 4px 0 rgba(80,60,160,.2)}
  button.icon:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(80,60,160,.2)}
  button.icon svg{width:22px;height:22px}
  .prompt{position:fixed;left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top)) + 54px);width:max-content;max-width:calc(100% - 24px);margin:0;
    background:#fff;border-radius:22px;padding:8px 20px;box-shadow:0 4px 0 rgba(80,60,160,.14);font:600 clamp(1.05rem,4.2vw,1.35rem)/1.25 var(--display);text-align:center;pointer-events:none;transition:opacity .25s}
  .prompt:empty{opacity:0}
  .prompt .tag{display:inline-block;font:700 .78em var(--display);color:#fff;border-radius:999px;padding:1px 10px;margin-right:8px;vertical-align:2px}
  .prompt.pop{animation:nudge .35s cubic-bezier(.3,1.6,.5,1)}
  @keyframes nudge{from{transform:translateX(-50%) scale(.85)}to{transform:translateX(-50%) scale(1)}}
  .go{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--accent);color:#fff;padding:12px 38px;font-size:1.3rem;box-shadow:0 5px 0 var(--accent-dk);min-width:180px}
  .go:active{transform:translateX(-50%) translateY(4px);box-shadow:0 1px 0 var(--accent-dk)}
  .go[disabled]{opacity:.38;cursor:default;transform:translateX(-50%);box-shadow:0 5px 0 var(--accent-dk)}
  .go.next{background:#7b5cff;box-shadow:0 5px 0 #5a3fd6}
  .go[hidden]{display:none}
  .badge{position:fixed;display:grid;place-items:center;width:96px;height:96px;border-radius:50%;background:#fff;box-shadow:0 6px 0 rgba(80,60,160,.16),0 12px 30px rgba(80,60,160,.2);
    transform:rotate(-10deg) scale(0);transition:transform .45s cubic-bezier(.3,1.7,.5,1);pointer-events:none;text-align:center;line-height:1}
  .badge.on{transform:rotate(-10deg) scale(1)}
  .badge b{font:700 2.4rem var(--display);display:block}
  .badge span{font:700 .82rem var(--display);display:block;margin-top:2px}
  .msg{position:fixed;inset:0;display:grid;place-content:safe center;justify-items:center;gap:12px;padding:16px;text-align:center;
    background:rgba(246,240,255,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .35s;overflow:auto}
  .msg.on{opacity:1;pointer-events:auto}
  .msg h2{margin:0;font-family:var(--display);font-weight:700;color:var(--accent);font-size:clamp(2.4rem,10vw,3.6rem);line-height:1.02;text-shadow:0 4px 0 #ffd0e5}
  .msg p{margin:0;color:var(--muted);font-weight:700;font-size:1.08rem}
  .msg .big{font:700 1.2rem var(--display);color:var(--text)}
  .msg button.cta{background:var(--accent);color:#fff;padding:12px 38px;font-size:1.3rem;box-shadow:0 5px 0 var(--accent-dk);margin-top:6px}
  .msg button.cta:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-dk)}
  .msg.on .card{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
  .card{display:grid;gap:10px;justify-items:center;background:#fff;border-radius:32px;padding:24px 28px 28px;width:min(400px,calc(100vw - 32px));box-shadow:0 8px 0 rgba(123,92,255,.14),0 18px 44px rgba(80,60,160,.18)}
  .eye{width:110px;height:110px}
  .grade{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;font:700 3.6rem var(--display);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.12)}
  .rows{width:100%;display:grid;gap:6px;margin:4px 0}
  .row{display:grid;grid-template-columns:72px 1fr 34px;align-items:center;gap:8px;font-weight:800;font-size:.95rem}
  .row .nm{text-align:left;font-family:var(--display);font-weight:600}
  .row .bar{height:12px;border-radius:999px;background:#f1ecff;overflow:hidden}
  .row .bar i{display:block;height:100%;border-radius:999px;width:0;transition:width .7s cubic-bezier(.2,.8,.3,1)}
  .row .v{text-align:right;font-variant-numeric:tabular-nums}
  .lvl{width:100%;text-align:left;font-weight:800;font-size:.95rem}
  .lvl .bar{height:14px;border-radius:999px;background:#f1ecff;overflow:hidden;margin-top:4px}
  .lvl .bar i{display:block;height:100%;background:linear-gradient(90deg,#7cc4ff,#b39cff,#ff8fb8);border-radius:999px;transition:width .9s cubic-bezier(.2,.8,.3,1)}
  .unlock{background:#fff4c9;color:#8a6200;border-radius:16px;padding:6px 14px;font-weight:800}
  .unlock:empty{display:none}
  .hud,.prompt,.go,.msg .card,.badge{zoom:var(--k,1)}
  .sa,.sb{display:grid;gap:10px;justify-items:center;width:100%}
  @media (max-height:560px) and (min-aspect-ratio:5/4){
    .prompt{top:max(10px,env(safe-area-inset-top));max-width:calc(100% - 480px);font-size:1rem;padding:6px 16px}
    .go{left:auto;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));transform:none;min-width:0;padding:12px 26px}
    .go:active{transform:translateY(4px)}.go[disabled]{transform:none}
    .msg .card.sum{grid-template-columns:auto 1fr;width:min(680px,calc(100vw - 32px));align-items:center;gap:6px 24px}
    .msg .card.sum .big{font-size:1rem}
  }
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
  @media (max-width:520px){.chip{padding:4px 11px;font-size:.92rem}.chip .nm{display:none}button.icon{width:40px;height:40px}.badge{width:80px;height:80px}.badge b{font-size:2rem}}
  @media (max-height:560px){.card{padding:14px 22px 18px;gap:6px}.grade{width:76px;height:76px;font-size:2.6rem}.eye{width:76px;height:76px}}
  @media (prefers-reduced-motion:reduce){.msg.on .card,.prompt.pop{animation:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Perception test"></canvas>
<header class="hud">
  <h1 class="sr">Eyeball It!</h1>
  <div class="chips"><span class="chip" id="prog">Test <b id="tn">1</b>/5<span class="pips" id="pips"></span></span><span class="chip">Eye Lv <b id="lv">1</b></span></div>
  <div class="icons"><button class="icon" id="snd" aria-label="Sound (M)" title="Sound (M)"></button></div>
</header>
<p class="prompt" id="prompt" aria-live="polite"></p>
<div class="badge" id="badge"><div><b id="bs">0</b><span id="bw"></span></div></div>
<button class="go" id="go" hidden>Lock in</button>
<div class="msg" id="msg"><div class="card" id="mcard"></div></div>
<script type="text/plain" data-pg-game>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
const TAU=Math.PI*2,R=Math.random;
const ri=(a,b)=>a+Math.floor(R()*(b-a+1)),pick=a=>a[R()*a.length|0],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>1-Math.pow(1-t,3);
// Score from error: 100 when exact, 50 at the half-score error k, and a long gentle tail.
const lin=(err,k)=>Math.round(100/(1+(err/k)**2));
const PAL=['#ff8fb8','#ffc94d','#5fd8b6','#7cc4ff','#b39cff','#ffa978','#9bdc6b','#f59ad6'];

// ---- tests ----
// Each test draws in card units: (0,0) is the card's top-left, (1,1) its bottom-right.
const TESTS={
  count:{name:'Count',col:'#ff8fb8',make:mkCount},
  angle:{name:'Angle',col:'#7cc4ff',make:mkAngle},
  split:{name:'Split',col:'#5fd8b6',make:mkSplit},
  catch:{name:'Catch',col:'#ffa978',make:mkCatch},
  color:{name:'Color',col:'#b39cff',make:mkColor},
  beat:{name:'Beat',col:'#f59ad6',make:mkBeat},
  size:{name:'Size',col:'#ffc94d',make:mkSize},
  center:{name:'Center',col:'#7cc4ff',make:mkCenter},
  length:{name:'Length',col:'#9bdc6b',make:mkLength},
  line:{name:'Line Up',col:'#ff8fb8',make:mkLine},
};
const ORDER=['count','angle','split','catch','color','beat','size','center','length','line'];

let g=ctx,S=300; // g draws in card units
function lw(px){return px/S}
function circ(x,y,r,fill,stroke,w){g.beginPath();g.arc(x,y,Math.max(0,r),0,TAU);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=w||lw(3);g.stroke()}}
function seg(x1,y1,x2,y2,col,w,dash){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.setLineDash(dash?[dash,dash*1.2]:[]);g.stroke();g.setLineDash([])}
function txt(s,x,y,size,col,weight,align){g.save();g.scale(1/S,1/S);g.font=`${weight||700} ${Math.round(size*S)}px Fredoka,Nunito,sans-serif`;g.fillStyle=col||'#3b2a5c';g.textAlign=align||'center';g.textBaseline='middle';g.fillText(s,x*S,y*S);g.restore()}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function cloud(x0,x1,y0,y1,col){g.fillStyle=col;rr(x0,y0,x1-x0,y1-y0,.06);g.fill();
  const n=Math.max(3,Math.round((x1-x0)/.09));for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n;circ(x,y0+.01,.055+.015*Math.sin(i*2.3),col);circ(x,y1-.01,.055+.015*Math.cos(i*1.7),col)}}
// 3-2-1 before anything is shown, so the player knows exactly when to look.
function countdown(t,T0,label){const step=T0/3,i=Math.min(2,Math.floor(t/step)),k=ease(clamp((t-i*step)/(step*.5),0,1));
  circ(.5,.46,(.13+.03*(1-k))*(.6+.4*k),'#f3eeff');txt(String(3-i),.5,.465,.13*(.6+.4*k),'#b39cff',700);txt(label,.5,.68,.055,'#7a6f9c',700)}
// The switch from watching to playing: a pop-up "Your turn!" and a new prompt.
function turn(o,t,msg){o.turnAt=t;setPrompt(msg);sfx.turn()}
function drawTurn(o,t){if(o.turnAt==null||o.rev)return;const k=t-o.turnAt;if(k>1.1)return;
  const a=k<.8?1:1-(k-.8)/.3,sc=.6+.4*ease(clamp(k/.25,0,1))+(k<.35?.06*Math.sin(k/.35*Math.PI):0);
  g.save();g.globalAlpha=Math.max(0,a);g.translate(.5,.18);g.scale(sc,sc);g.rotate(-.05);
  rr(-.24,-.065,.48,.13,.065);g.fillStyle='#ff5fa2';g.fill();txt('Your turn!',0,.003,.065,'#fff',700);g.restore()}

// Slider: horizontal, value null until touched.
function Slider(o){return Object.assign({x0:.16,x1:.84,y:.86,v:null,min:0,max:1,step:0,drag:false,rainbow:false,col:'#ff8fb8'},o)}
function slSet(sl,p){let f=clamp((p.x-sl.x0)/(sl.x1-sl.x0),0,1),v=sl.min+f*(sl.max-sl.min);if(sl.step)v=Math.round(v/sl.step)*sl.step;sl.v=v}
function slDown(sl,p){if(Math.abs(p.y-sl.y)<.1&&p.x>sl.x0-.06&&p.x<sl.x1+.06){sl.drag=true;slSet(sl,p);return true}return false}
function slDraw(sl){const y=sl.y,w=lw(14);
  if(sl.rainbow){const gr=g.createLinearGradient(sl.x0,0,sl.x1,0);for(let i=0;i<=12;i++)gr.addColorStop(i/12,`hsl(${i*30},78%,70%)`);seg(sl.x0,y,sl.x1,y,gr,w*1.6)}
  else{seg(sl.x0,y,sl.x1,y,'#efe9ff',w);if(sl.v!=null)seg(sl.x0,y,sl.x0+(sl.x1-sl.x0)*(sl.v-sl.min)/(sl.max-sl.min),y,sl.col,w)}
  const f=sl.v==null?.5:(sl.v-sl.min)/(sl.max-sl.min),x=sl.x0+(sl.x1-sl.x0)*f;
  circ(x,y+lw(3),lw(19),'rgba(80,60,160,.15)');circ(x,y,lw(19),'#fff',sl.v==null?'#d6ccf5':(sl.rainbow?'#3b2a5c':sl.col),lw(4));
  if(sl.v==null){const a=.5+.5*Math.sin(now*5);txt('drag',x,y-lw(36),.04,`rgba(122,111,156,${.5+a*.5})`,700)}}

function mkCount(d){
  const lo=Math.round(5+d*11),hi=Math.round(11+d*32),n=ri(lo,hi),dots=[];let tries=0;
  while(dots.length<n&&tries<8000){tries++;const a=R()*TAU,q=Math.sqrt(R())*.38,r=(.016+R()*.016)*(1.15-d*.3),x=.5+Math.cos(a)*q,y=.42+Math.sin(a)*q*.86;
    if(dots.every(o=>Math.hypot(o.x-x,o.y-y)>o.r+r+.014))dots.push({x,y,r,c:pick(PAL)})}
  const N=dots.length,flash=1.6-d*.7,T0=1.5,max=Math.max(30,Math.ceil(N*1.7/10)*10);
  const sl=Slider({min:0,max,step:1,col:'#ff8fb8'});
  return{lock:true,T0,prompt:'Count the dots! They vanish fast…',
    update(t){if(t>=T0&&!this.s){this.s=1;sfx.flash()}if(t>=T0+flash+.3&&!this.ask){this.ask=1;this.ready=false;turn(this,t,'How many dots were there?')}this.ready=sl.v!=null},
    draw(t){if(t<T0){countdown(t,T0,'Get ready to count');return}
      const gone=this.rev?1:clamp((t-T0-flash)/.25,0,1),pop=clamp((t-T0)/.12,0,1);
      if(gone<1||this.rev){g.globalAlpha=this.rev?.55:1;const k=this.rev?1:pop*(1-ease(gone));dots.forEach(o=>circ(o.x,o.y,o.r*k,o.c));g.globalAlpha=1}
      if(this.ask){
        if(!this.rev){txt(sl.v==null?'?':String(sl.v),.5,.42,.2,'#3b2a5c',700)}
        else{g.save();g.scale(1/S,1/S);g.font=`700 ${Math.round(.2*S)}px Fredoka,Nunito,sans-serif`;g.textAlign='center';g.textBaseline='middle';g.lineWidth=10;g.strokeStyle='#fff';g.lineJoin='round';g.strokeText(String(N),.5*S,.42*S);g.restore();txt(String(N),.5,.42,.2,'#2fbf8f',700)}
        slDraw(sl);
        [[.06,'−',-1],[.94,'+',1]].forEach(([x,s])=>{circ(x,sl.y,.045,'#f3eeff');txt(s,x,sl.y+.003,.06,'#7a6f9c',700)})}},
    down(p,t){if(!this.ask)return;
      if(Math.hypot(p.x-.06,p.y-sl.y)<.06||Math.hypot(p.x-.94,p.y-sl.y)<.06){sl.v=clamp((sl.v==null?Math.round(max/2):sl.v)+(p.x<.5?-1:1),0,max);sfx.tick();return}
      if(slDown(sl,p))sfx.tick()},
    move(p){if(sl.drag){const o=sl.v;slSet(sl,p);if(o!==sl.v)sfx.tick()}},up(){sl.drag=false},
    key(k){if(!this.ask)return;if(k==='ArrowRight'||k==='ArrowUp')sl.v=clamp((sl.v??Math.round(max/2))+1,0,max);if(k==='ArrowLeft'||k==='ArrowDown')sl.v=clamp((sl.v??Math.round(max/2))-1,0,max)},
    score(){const e=Math.abs(sl.v-N)/N;return{s:lin(e,.18),txt:`There were ${N}. You said ${sl.v}.`}}};
}

function mkAngle(d){
  const hiA=Math.round(165+d*175),A=ri(3,Math.floor(hiA/5))*5,cx=.5,cy=A>180?.5:.62,L=.36;
  let a=null,drag=false;
  const ang=p=>{let v=Math.atan2(-(p.y-cy),p.x-cx)*180/Math.PI;if(v<0)v+=360;return v};
  return{lock:true,prompt:`Make a <b>${A}°</b> angle`,
    update(){this.ready=a!=null},
    draw(){const cur=a??0,rad=cur*Math.PI/180;
      if(a!=null){g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,L*.55,0,-rad,true);g.closePath();g.fillStyle='rgba(124,196,255,.25)';g.fill()}
      if(this.rev){const tr=A*Math.PI/180;seg(cx,cy,cx+Math.cos(tr)*L,cy-Math.sin(tr)*L,'#2fbf8f',lw(10),lw(10))}
      seg(cx,cy,cx+L,cy,'#3b2a5c',lw(12));
      seg(cx,cy,cx+Math.cos(rad)*L,cy-Math.sin(rad)*L,'#7cc4ff',lw(12));
      circ(cx,cy,lw(10),'#3b2a5c');
      const hx=cx+Math.cos(rad)*L,hy=cy-Math.sin(rad)*L;circ(hx,hy,lw(20),'#fff','#7cc4ff',lw(5));
      if(a==null){txt('drag the blue arm',.5,.12,.045,'#7a6f9c',700)}},
    down(p){drag=true;a=ang(p);sfx.tick()},move(p){if(drag){const o=Math.round(a/3);a=ang(p);if(Math.round(a/3)!==o)sfx.click()}},up(){drag=false},
    key(k){if(k==='ArrowLeft'||k==='ArrowUp')a=((a??0)+1)%360;if(k==='ArrowRight'||k==='ArrowDown')a=((a??0)+359)%360},
    score(){let e=Math.abs(a-A);e=Math.min(e,360-e);return{s:lin(e,12),txt:`Target ${A}°. Yours was ${Math.round(a)}°.`}}};
}

function mkSplit(d){
  const qMax=4+Math.round(d*5);let p,q;do{q=ri(3,qMax);p=ri(1,q-1)}while(gcd(p,q)!==1);
  const left=R()<.5,x0=.08,x1=.92,y=.5,tf=p/q;let f=null,drag=false;
  return{lock:true,prompt:`Tap <b>${p}/${q}</b> of the way from the <b>${left?'left':'right'}</b>`,
    update(){this.ready=f!=null},
    draw(){seg(x0,y,x1,y,'#efe9ff',lw(22));
      const sx=left?x0:x1;circ(sx,y,lw(18),'#5fd8b6');txt('start',sx,y+.08,.04,'#2fa886',700);circ(left?x1:x0,y,lw(10),'#d6ccf5');
      if(f!=null){const x=x0+(x1-x0)*f;seg(x,y-.09,x,y+.09,'#3b2a5c',lw(7));circ(x,y-.09,lw(9),'#3b2a5c')}
      if(this.rev){const fx=left?tf:1-tf,x=x0+(x1-x0)*fx;seg(x,y-.13,x,y+.13,'#2fbf8f',lw(6),lw(7));txt(`${p}/${q}`,x,y-.18,.05,'#2fbf8f',700)}},
    down(pt){drag=true;f=clamp((pt.x-x0)/(x1-x0),0,1);sfx.tick()},move(pt){if(drag)f=clamp((pt.x-x0)/(x1-x0),0,1)},up(){drag=false},
    key(k){if(k==='ArrowRight')f=clamp((f??.5)+.005,0,1);if(k==='ArrowLeft')f=clamp((f??.5)-.005,0,1)},
    score(){const u=left?f:1-f,e=Math.abs(u-tf);return{s:lin(e,.045),txt:`You were ${Math.round(e*100)}% of the bar off.`}}};
}
function gcd(a,b){return b?gcd(b,a%b):a}

function mkCatch(d){

    update(t){if(!this.done&&t>arrive+1.4){this.done=1;tap=null;lockIn()}},
    draw(t){seg(.04,y+.06,.96,y+.06,'#efe9ff',lw(10));
      if(t<T0){const i=Math.min(2,Math.floor(t/(T0/3)));txt(String(3-i),.5,.2,.1,'#b39cff',700)}else if(t<T0+.6){g.globalAlpha=1-(t-T0)/.6;txt('Go!',.5,.2,.1,'#ff5fa2',700);g.globalAlpha=1}
      const x=bx(tap??t);circ(x,y,.045,'#ffa978');circ(x-.014,y-.014,.013,'rgba(255,255,255,.7)');
      cloud(c0,1.02,.3,.78,'#e8e1ff');
      seg(xf,y+.06,xf,y-.2,'#3b2a5c',lw(7));g.beginPath();g.moveTo(xf,y-.2);g.lineTo(xf+.1,y-.165);g.lineTo(xf,y-.13);g.closePath();g.fillStyle='#ff5fa2';g.fill();
      if(this.rev){g.globalAlpha=.85;circ(tap==null?bx(arrive+1.4):bx(tap),y,.045,'#ffa978','#3b2a5c',lw(3));g.globalAlpha=1;circ(xf,y,.045,null,'#2fbf8f',lw(4))}},
    down(p,t){if(t<T0+.2||this.done)return;this.done=1;tap=t;sfx.tap();lockIn()},
    key(k,t){if(k===' ')this.down(null,t)},
    score(){if(tap==null)return{s:0,txt:'Too slow! The ball got away.'};const e=tap-arrive;
      return{s:lin(Math.abs(e),.2),txt:Math.abs(e)<.02?'Right on the flag!':`${Math.abs(e).toFixed(2)}s ${e<0?'early':'late'}.`}}};
}

function mkColor(d){

  const hsl=h=>`hsl(${h},78%,70%)`;
  return{lock:true,T0,prompt:'Remember this color…',
    update(t){if(t>=T0+show+.3&&!this.ask){this.ask=1;turn(this,t,'Now find that color again!')}this.ready=sl.v!=null},
    draw(t){if(t<T0){countdown(t,T0,'Remember the color');return}
      if(!this.ask){const k=ease(clamp((t-T0)/.2,0,1))*(1-ease(clamp((t-T0-show)/.3,0,1)));circ(.5,.44,.26*k,hsl(H));return}
      if(this.rev){g.beginPath();g.moveTo(.5,.44);g.arc(.5,.44,.26,Math.PI/2,Math.PI*1.5);g.fillStyle=hsl(H);g.fill();
        g.beginPath();g.moveTo(.5,.44);g.arc(.5,.44,.26,-Math.PI/2,Math.PI/2);g.fillStyle=hsl(sl.v);g.fill();
        txt('target',.36,.44,.042,'#fff',700);txt('yours',.64,.44,.042,'#fff',700)}

      slDraw(sl)},
    down(p){if(this.ask&&slDown(sl,p))sfx.tick()},move(p){if(sl.drag)slSet(sl,p)},up(){sl.drag=false},
    key(k){if(!this.ask)return;if(k==='ArrowRight')sl.v=((sl.v??180)+2)%360;if(k==='ArrowLeft')sl.v=((sl.v??180)+358)%360},
    score(){let e=Math.abs(sl.v-H);e=Math.min(e,360-e);return{s:lin(e,22),txt:e<4?'Spot on!':`${Math.round(e)}° around the color wheel off.`}}};
}

function mkBeat(d){
  const near=tt=>{const k=(tt-T0)/I;return Math.min(1,Math.abs(k-Math.round(k)))};
  const I=.66-d*.18+(R()-.5)*.08,T0=.9,taps=[],guide=[0,1,2,3].map(k=>T0+k*I),exp=[...Array(8)].map((_,i)=>T0+(4+i)*I);let pulse=0,gi=0,ring=[];
  const goT=guide[3]+.12,assist=d<.5?2:0;let fb=[];
  return{lock:false,prompt:'Listen and watch the beat…',
    update(t,dt){pulse=Math.max(0,pulse-dt*4);while(gi<4&&t>=guide[gi]){gi++;pulse=1;sfx.beat(gi===4)}
      if(t>=guide[3]&&!this.go){this.go=1;turn(this,t,'Keep the beat going! Tap <b>8</b> times')}
      while(gi>=4&&gi<4+assist&&t>=exp[gi-4]){gi++;pulse=.45}
      if(!this.done&&t>exp[7]+1.6){this.done=1;lockIn()}ring.forEach(r=>r.k+=dt*2.5);ring=ring.filter(r=>r.k<1)},
    draw(t){const r=.17+pulse*.05;circ(.5,.44,r+.03,'rgba(245,154,214,.25)');circ(.5,.44,r,this.go?'#f59ad6':'#ffc2e6');
      ring.forEach(o=>circ(.5,.44,.2+o.k*.2,null,o.ok?`rgba(47,191,143,${1-o.k})`:`rgba(245,154,214,${1-o.k})`,lw(6)));
      txt(this.go?(taps.length?String(taps.length):'tap!'):(gi?String(gi):'…'),.5,.44,.1,'#fff',700);
      const n=12;for(let i=0;i<n;i++){const x=.12+i*(.76/(n-1)),on=i<4?i<Math.min(gi,4):i-4<taps.length;circ(x,.8,lw(9),on?(i<4?'#b39cff':(fb[i-4]?'#2fbf8f':'#f59ad6')):'#efe9ff')}
      if(this.rev){const x=tt=>.08+(tt-T0)/(exp[7]+I-T0)*.84;seg(.06,.92,.94,.92,'#efe9ff',lw(6));
        guide.concat(exp).forEach(tt=>seg(x(tt),.89,x(tt),.95,'#2fbf8f',lw(4)));taps.forEach(tt=>circ(clamp(x(tt),.04,.96),.92,lw(6),'#3b2a5c'))}},
    down(p,t){if(!this.go||this.done||taps.length>=8||t<guide[3]+I*.4)return;taps.push(t);const ok=near(t)<.15;fb.push(ok);ring.push({k:0,ok});sfx.beat(false,true);
      if(taps.length===8){this.done=1;setTimeout(lockIn,250)}},
    key(k,t){if(k===' ')this.down(null,t)},
    // Each tap counts against its nearest beat, so starting a beat late is not a disaster.
    score(){let s=taps.reduce((a,tt)=>a+near(tt),0)+(8-taps.length);s/=8;
      return{s:lin(s,.2),txt:taps.length<8?`Only ${taps.length} of 8 taps.`:`Off the beat by ${Math.round(s*I*1000)}ms on average.`}}};
}

function mkSize(d){

  return{lock:true,T0,prompt:'Remember how big this circle is…',

    draw(t){if(t<T0){countdown(t,T0,'Remember the size');return}
      if(!this.ask){const a=1-clamp((t-T0-show)/.3,0,1);g.globalAlpha=a;circ(tx,ty,Rt*ease(clamp((t-T0)/.2,0,1)),'#ffc94d');g.globalAlpha=1;return}
      const cr=r??r0;circ(.5,.5,cr,r==null?'#fff1c4':'#ffc94d');
      if(this.rev)circ(.5,.5,Rt,null,'#2fbf8f',lw(5));
      circ(.5+cr,.5,lw(16),'#fff','#e5ad25',lw(5));if(r==null)txt('drag the edge',.5,.93,.045,'#7a6f9c',700)},
    down(p){if(!this.ask)return;drag=true;r=clamp(Math.hypot(p.x-.5,p.y-.5),.03,.45);sfx.tick()},move(p){if(drag)r=clamp(Math.hypot(p.x-.5,p.y-.5),.03,.45)},up(){drag=false},
    key(k){if(!this.ask)return;if(k==='ArrowRight'||k==='ArrowUp')r=clamp((r??r0)+.003,.03,.45);if(k==='ArrowLeft'||k==='ArrowDown')r=clamp((r??r0)-.003,.03,.45)},

function mkCenter(d){
  let cx,cy,r,a0,span;
  for(let k=0;k<200;k++){r=.2+R()*.16;span=(200-d*90+R()*40)*Math.PI/180;a0=R()*TAU;cx=.15+R()*.7;cy=.15+R()*.7;let ok=true;
    for(let i=0;i<=20;i++){const a=a0+span*i/20,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;if(x<.07||x>.93||y<.07||y>.93){ok=false;break}}if(ok)break}
  let p=null,drag=false;

    update(){this.ready=p!=null},
    draw(){if(this.rev){circ(cx,cy,r,null,'#c9eedf',lw(5));circ(cx,cy,lw(9),'#2fbf8f')}
      g.beginPath();g.arc(cx,cy,r,a0,a0+span);g.strokeStyle='#7cc4ff';g.lineWidth=lw(12);g.lineCap='round';g.stroke();
      if(p){if(this.rev)seg(p.x,p.y,cx,cy,'#2fbf8f',lw(3),lw(5));circ(p.x,p.y,lw(16),null,'#3b2a5c',lw(4));circ(p.x,p.y,lw(4),'#3b2a5c')}},
    down(q){drag=true;p={x:q.x,y:q.y};sfx.tick()},move(q){if(drag)p={x:q.x,y:q.y}},up(){drag=false},
    score(){const e=Math.hypot(p.x-cx,p.y-cy)/r;return{s:lin(e,.13),txt:e<.03?'Bullseye!':`Off by ${Math.round(e*100)}% of the radius.`}}};

function mkLength(d){
  const L=.2+R()*.32,th=pick([90,90,60,120,45,135])*Math.PI/180,mx=.5,my=.36,x0=.08,y=.82;let l=null,drag=false;const l0=L>.36?.12:.7;
  const ax=mx-Math.cos(th)*L/2,ay=my+Math.sin(th)*L/2,bx=mx+Math.cos(th)*L/2,by=my-Math.sin(th)*L/2;
  return{lock:true,prompt:'Make your line the <b>same length</b>',
    update(){this.ready=l!=null},
    draw(){seg(ax,ay,bx,by,'#9bdc6b',lw(12));circ(ax,ay,lw(9),'#6fbf3c');circ(bx,by,lw(9),'#6fbf3c');
      const cl=l??l0;seg(x0,y,x0+cl,y,l==null?'#d9f2c8':'#3b2a5c',lw(12));circ(x0,y,lw(9),'#3b2a5c');circ(x0+cl,y,lw(18),'#fff','#3b2a5c',lw(5));

    down(p){drag=true;l=clamp(p.x-x0,.03,.86);sfx.tick()},move(p){if(drag)l=clamp(p.x-x0,.03,.86)},up(){drag=false},
    key(k){if(k==='ArrowRight')l=clamp((l??l0)+.003,.03,.86);if(k==='ArrowLeft')l=clamp((l??l0)-.003,.03,.86)},
    score(){const e=Math.abs(l-L)/L;return{s:lin(e,.1),txt:`You were ${Math.round(e*100)}% ${l>L?'too long':'too short'}.`}}};

function mkLine(d){
  const c0=.3,c1=.66+d*.06,rx=.84;let ya,sl,yt;
  do{ya=.15+R()*.7;sl=(R()<.5?-1:1)*(.15+R()*.75);yt=ya+sl*(rx-.06)}while(yt<.12||yt>.88);
  const ye=ya+sl*(c0-.06);let y=null,drag=false;

const SND={on:true,ctx:null};
try{SND.on=localStorage.getItem('eyeSound')!=='off'}catch(e){}
function audio(){
  if(!SND.on||!SND.armed)return null;
  if(!SND.ctx){try{const C=window.AudioContext||window.webkitAudioContext,a=new C();SND.ctx=a;
    const comp=a.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=3;comp.connect(a.destination);
    SND.out=a.createGain();SND.out.gain.value=.8;SND.out.connect(comp);
    const len=a.sampleRate*1.6|0,ir=a.createBuffer(2,len,a.sampleRate);
    for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.4)}
    const cvl=a.createConvolver();cvl.buffer=ir;SND.rev=a.createGain();SND.rev.gain.value=.35;SND.rev.connect(cvl);cvl.connect(SND.out);
    const nb=a.createBuffer(1,a.sampleRate,a.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;SND.nb=nb;
    if(a.state==='suspended'&&!document.hidden)a.resume();
  }catch(e){SND.on=false;return null}}
  return SND.ctx}
function out(a,G,rev){G.connect(SND.out);if(rev){const s=a.createGain();s.gain.value=rev;G.connect(s);s.connect(SND.rev)}}
function tone(f,o={}){const a=audio();if(!a)return;const {type='sine',t=0,at=.006,d=.3,g=.2,f2,sl=.08,rev=0}=o;
  const t0=a.currentTime+t,osc=a.createOscillator(),G=a.createGain();osc.type=type;
  osc.frequency.setValueAtTime(f,t0);if(f2)osc.frequency.exponentialRampToValueAtTime(f2,t0+sl);
  G.gain.setValueAtTime(0,t0);G.gain.linearRampToValueAtTime(g,t0+at);G.gain.exponentialRampToValueAtTime(.0001,t0+at+d);
  osc.connect(G);out(a,G,rev);osc.start(t0);osc.stop(t0+at+d+.05)}
function hiss(o={}){const a=audio();if(!a)return;const {type='bandpass',t=0,at=.003,d=.1,g=.1,f=2000,f2,q=1}=o;
  const t0=a.currentTime+t,src=a.createBufferSource(),F=a.createBiquadFilter(),G=a.createGain();
  src.buffer=SND.nb;F.type=type;F.Q.value=q;F.frequency.setValueAtTime(f,t0);if(f2)F.frequency.exponentialRampToValueAtTime(f2,t0+at+d);
  G.gain.setValueAtTime(0,t0);G.gain.linearRampToValueAtTime(g,t0+at);G.gain.exponentialRampToValueAtTime(.0001,t0+at+d);
  src.connect(F);F.connect(G);out(a,G,0);src.start(t0,Math.random()*.6);src.stop(t0+at+d+.05)}
const jit=()=>1+(Math.random()-.5)*.06;
const sfx={
  tick(){tone(1500*jit(),{d:.03,g:.05});hiss({f:4200,q:3,d:.012,g:.03})},
  click(){hiss({f:5200*jit(),q:4,d:.008,g:.02})},
  tap(){tone(700*jit(),{f2:420,sl:.06,d:.1,g:.16})},
  flash(){tone(880,{f2:1320,sl:.05,d:.12,g:.1,rev:.3})},
  beat(last,user){user?tone(660*jit(),{type:'triangle',d:.09,g:.18}):(tone(last?1046:784,{type:'triangle',d:.12,g:.2,rev:.2}),hiss({f:3000,q:2,d:.02,g:.05}))},
  lock(){tone(520,{f2:780,sl:.06,d:.12,g:.13})},
  count(){tone(660,{type:'triangle',d:.1,g:.12})},
  turn(){tone(587,{d:.12,g:.12});tone(880,{t:.09,d:.25,g:.13,rev:.3})},
  score(s){const n=s>=95?5:s>=85?4:s>=70?3:s>=50?2:s>=25?1:0;
    if(n===0){tone(300,{type:'triangle',f2:220,sl:.15,d:.2,g:.1});return}
    for(let i=0;i<n;i++){const f=523.25*Math.pow(2,[0,4,7,12,16][i]/12);tone(f,{t:i*.07,d:.5,g:.09,rev:.5})}},
  fanfare(){[0,4,7,12,16,19].forEach((s,i)=>{const f=392*Math.pow(2,s/12);tone(f,{t:i*.08,d:1.2,g:.1,rev:.7});tone(f*2,{t:i*.08,d:.5,g:.025,rev:.6})})},
};

const VER='1.1.0';
function track(n,d){try{if(window.bridge&&bridge.analytics)bridge.analytics.send(n,Object.assign({game_version:VER},d||{}))}catch(e){}}
const perf={ft:[],start:0,active:0};
function perfFrame(ms,active){
  const nowMs=performance.now();if(!perf.start)perf.start=nowMs;
  if(active&&!document.hidden&&ms>0&&ms<2000){perf.ft.push(ms);perf.active+=ms}
  if(nowMs-perf.start>=30000){const f=perf.ft.slice().sort((a,b)=>a-b),n=f.length;
    if(n>30){const q=p=>f[Math.min(n-1,Math.floor(p*n))],fps=f.map(x=>1000/x).sort((a,b)=>a-b),over=t=>f.filter(x=>x>t).length;
      track('performance_sample',{target_fps:60,window_ms:Math.round(nowMs-perf.start),active_ms:Math.round(perf.active),frame_count:n,
        fps_avg:Math.round(n/(perf.active/1000)*10)/10,fps_p10:Math.round(fps[Math.floor(.1*n)]*10)/10,
        frame_time_p50_ms:+q(.5).toFixed(2),frame_time_p95_ms:+q(.95).toFixed(2),frame_time_p99_ms:+q(.99).toFixed(2),frame_time_max_ms:+f[n-1].toFixed(2),
        frames_over_50ms:over(50),frames_over_100ms:over(100),frames_over_250ms:over(250),frames_over_500ms:over(500),frames_over_1000ms:over(1000),build_version:VER})}
    perf.ft=[];perf.active=0;perf.start=nowMs}
}

// ---- progress ----
const TITLES=['Squinty','Peeper','Keen Bean','Sharp Shooter','Hawk Eye','Eagle Eye','Laser Eyes','Owl Wizard','All-Seeing'];
let save={rounds:0,xp:0,best:0,plays:{},bestT:{}};
try{Object.assign(save,JSON.parse(localStorage.getItem('eyeSave'))||{})}catch(e){}
function persist(){try{localStorage.setItem('eyeSave',JSON.stringify(save))}catch(e){}}
function lvlInfo(xp){let L=1,need=250;while(xp>=need){xp-=need;L++;need+=50}return{L,into:xp,need}}
const unlockedN=()=>Math.min(ORDER.length,5+save.rounds);
function title(L){return TITLES[Math.min(TITLES.length-1,Math.floor((L-1)/2))]}

// ---- round flow ----
let round=[],idx=0,results=[],cur=null,curId='',t=0,now=0,phase='title',W=0,H=0,DPR=1,card={x:0,y:0,s:300},bgT=0,lastReal=0;
function setPrompt(h,pop){const p=$('prompt');p.innerHTML=h;p.classList.remove('pop');void p.offsetWidth;p.classList.add('pop')}
function pips(){$('tn').textContent=Math.min(idx+1,5);$('pips').innerHTML=round.map((_,i)=>`<i class="${i<idx?'done':i===idx?'on':''}"></i>`).join('')}
function startRound(){
  const n=unlockedN(),pool=ORDER.slice(0,n),fresh=save.rounds>0&&n>5&&n<=ORDER.length&&5+save.rounds-1<ORDER.length?ORDER[n-1]:null;
  const ranked=pool.filter(id=>id!==fresh).map(id=>({id,k:(save.plays[id]||0)+R()*1.5})).sort((a,b)=>a.k-b.k).map(o=>o.id);
  round=(fresh?[fresh]:[]).concat(ranked).slice(0,5);
  for(let i=round.length-1;i>0;i--){const j=R()*(i+1)|0;[round[i],round[j]]=[round[j],round[i]]}
  idx=0;results=[];hideMsg();track('progression_started',{step_id:'round',step_index:save.rounds+1});startTest();
}
function diff(){return clamp(save.rounds/12,0,1)}
function startTest(){
  curId=round[idx];cur=TESTS[curId].make(diff());t=0;phase='play';pips();
  setPrompt(`<span class="tag" style="background:${TESTS[curId].col}">${TESTS[curId].name}</span>${cur.prompt}`);
  $('badge').classList.remove('on');
  const go=$('go');go.className='go';go.textContent='Lock in';go.hidden=!cur.lock;go.disabled=true;
}
function lockIn(){
  if(phase!=='play'||!cur)return;
  if(cur.lock&&!cur.ready)return;
  const r=cur.score();r.s=clamp(r.s|0,0,100);r.id=curId;results.push(r);cur.rev=1;phase='reveal';
  save.plays[curId]=(save.plays[curId]||0)+1;track('test_completed',{test_id:curId,step_index:idx+1,score:r.s});if(r.s>(save.bestT[curId]||0))save.bestT[curId]=r.s;persist();
  sfx.lock();setTimeout(()=>sfx.score(r.s),180);
  $('bs').textContent=r.s;$('bs').style.color=scoreCol(r.s);$('bw').textContent=word(r.s);$('bw').style.color=scoreCol(r.s);
  setTimeout(()=>$('badge').classList.add('on'),120);
  setPrompt(r.txt);
  if(r.s>=85)burst(card.x+card.s*.5,card.y+card.s*.45,r.s>=95?40:22);
  const go=$('go');go.hidden=false;go.disabled=false;go.className='go next';go.textContent=idx<4?'Next ›':'See score ›';
}
function next(){if(phase!=='reveal')return;idx++;if(idx<round.length)startTest();else summary()}
function word(s){return s>=95?'Perfect!':s>=85?'Amazing!':s>=70?'Great!':s>=50?'Good':s>=25?'Close-ish':'Oops!'}
function scoreCol(s){return s>=85?'#2fbf8f':s>=70?'#4aa8f0':s>=50?'#e5a51b':'#ff5fa2'}
function grade(s){return s>=95?['S','#b38cff']:s>=85?['A','#2fbf8f']:s>=70?['B','#4aa8f0']:s>=55?['C','#ffb43a']:s>=40?['D','#ff8a5c']:['F','#ff5fa2']}

function summary(){
  phase='summary';$('go').hidden=true;$('badge').classList.remove('on');setPrompt('');
  const tot=Math.round(results.reduce((a,r)=>a+r.s,0)/results.length),[G,gc]=grade(tot),before=lvlInfo(save.xp),nb=tot>save.best,prevN=unlockedN();
  save.rounds++;save.xp+=tot;if(nb)save.best=tot;persist();
  const after=lvlInfo(save.xp),n=unlockedN(),unl=n>prevN?TESTS[ORDER[n-1]]:null;
  $('lv').textContent=after.L;
  track('progression_completed',{step_id:'round',step_index:save.rounds,score:tot,grade:G});if(unl)track('test_unlocked',{test_id:ORDER[n-1]});if(after.L>before.L)track('level_up',{eye_level:after.L});
  const rows=results.map(r=>`<div class="row"><span class="nm">${TESTS[r.id].name}</span><span class="bar"><i data-w="${r.s}" style="background:${TESTS[r.id].col}"></i></span><span class="v">${r.s}</span></div>`).join('');
  $('mcard').className='card sum';
  $('mcard').innerHTML=`<div class="sa"><div class="grade" style="background:${gc}">${G}</div>
    <h2>${tot}<span style="font-size:.45em;color:#b3a8d6"> /100</span></h2>
    <p class="big">${nb&&save.rounds>1?'New best score!':tot>=85?'Those are sharp eyes!':tot>=60?'Nice eyeballing!':'Your eyes are warming up!'}</p></div>
    <div class="sb"><div class="rows">${rows}</div>
    <div class="lvl">Eye Lv ${after.L} · ${title(after.L)}${after.L>before.L?' <span style="color:#ff5fa2">Level up!</span>':''}<span style="float:right;color:#7a6f9c">Best ${save.best}</span><div class="bar"><i style="width:${before.L<after.L?0:before.into/before.need*100}%"></i></div></div>
    <p class="unlock">${unl?`New test unlocked: ${unl.name}!`:''}</p>
    <button class="cta" id="again">Play again</button></div>`;
  showMsg();$('again').onclick=()=>{sfx.lock();startRound()};
  setTimeout(()=>{document.querySelectorAll('.row .bar i').forEach(i=>i.style.width=i.dataset.w+'%');const b=document.querySelector('.lvl .bar i');if(b)b.style.width=(after.into/after.need*100)+'%'},250);
  sfx.fanfare();if(tot>=70)burst(W/2,H*.3,50);
  window.pgBreak&&pgBreak();
}
function titleScreen(){
  phase='title';$('go').hidden=true;setPrompt('');pips();
  const L=lvlInfo(save.xp).L;$('lv').textContent=L;
  $('mcard').className='card';
  $('mcard').innerHTML=`<svg class="eye" viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="46" ry="30" fill="#fff" stroke="#3b2a5c" stroke-width="6"/><circle cx="50" cy="50" r="20" fill="#7cc4ff"/><circle cx="50" cy="50" r="10" fill="#3b2a5c"/><circle cx="56" cy="43" r="5" fill="#fff"/></svg>
    <h2>Eyeball It!</h2><p class="big">Five quick tests of your eyes.<br>How sharp are you?</p>
    ${save.rounds?`<p>Best ${save.best} · Eye Lv ${L} ${title(L)}</p>`:'<p>No rulers. No numbers. Just your eyes.</p>'}
    <button class="cta" id="play">Play</button>`;
  showMsg();$('play').onclick=()=>{sfx.lock();startRound()};
}
function showMsg(){$('msg').classList.add('on')}
function hideMsg(){$('msg').classList.remove('on')}

// ---- confetti ----
let fx=[];
function burst(x,y,n){for(let i=0;i<n;i++){const a=R()*TAU,v=200+R()*420;fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-220,r:4+R()*5,c:pick(PAL),life:1+R()*.6,rot:R()*TAU})}}

// ---- input ----
function unit(e){return{x:(e.clientX-card.x)/card.s,y:(e.clientY-card.y)/card.s}}
function clockAt(){return now+Math.min(.05,(performance.now()-lastReal)/1000)}
cv.addEventListener('pointerdown',e=>{SND.armed=true;if(phase!=='play'||!cur)return;
  if(cur.turnAt!=null&&t-cur.turnAt<.3&&curId!=='beat')return;try{cv.setPointerCapture(e.pointerId)}catch(_){}const p=unit(e);cur.down&&cur.down(p,t+(clockAt()-now))});
cv.addEventListener('pointermove',e=>{if(phase==='play'&&cur&&cur.move)cur.move(unit(e))});
const up=()=>{if(cur&&cur.up)cur.up()};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
$('go').onclick=()=>{SND.armed=true;phase==='play'?lockIn():next()};
$('snd').onclick=()=>{SND.armed=true;setSound(!SND.on)};
addEventListener('pointerdown',()=>{SND.armed=true;if(SND.on)audio()},true);
addEventListener('keydown',e=>{SND.armed=true;
  if(e.key==='m'||e.key==='M'){setSound(!SND.on);return}
  if(e.key==='Enter'||(e.key===' '&&phase!=='play')){e.preventDefault();if(phase==='title'||phase==='summary')startRound();else if(phase==='reveal')next();else lockIn();return}
  if(phase==='play'&&cur&&cur.key){e.preventDefault();cur.key(e.key,t+(clockAt()-now))}});

// ---- layout + frame ----
function layout(){
  DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR|0;cv.height=H*DPR|0;
  const k=clamp(Math.min(W,H)/820,1,1.9);document.documentElement.style.setProperty('--k',k.toFixed(3));
  const short=H<=560&&W/H>=1.25,pr=$('prompt').getBoundingClientRect(),top=short?pr.bottom+10:pr.top+(W<520?78:56)*k,avail=H-top-(short?14:86*k);
  const s=Math.max(160,Math.min(short?W-320:W-24,avail,620*k));card={s,x:(W-s)/2,y:top+Math.max(0,(avail-s)/2)};S=s;
  const b=$('badge'),bw=b.offsetWidth||90;b.style.left=Math.max(4,card.x-bw*.3)+'px';b.style.top=Math.max(card.y-bw*.35,top-bw*.5)+'px';
}
const BLOBS=[...Array(7)].map((_,i)=>({x:R(),y:R(),r:.12+R()*.16,c:PAL[i],sp:.2+R()*.3,ph:R()*TAU}));
function frame(ts){
  const real=ts/1000,dt=frame.last?Math.min(.05,Math.max(0,real-frame.last)):0;perfFrame(frame.last?(real-frame.last)*1000:0,phase==='play'||phase==='reveal');frame.last=real;lastReal=performance.now();
  now+=dt;bgT+=dt;
  if(phase==='play'&&cur){t+=dt;if(cur.T0&&t<cur.T0){const k=Math.floor(t/(cur.T0/3));if(k!==cur._k){cur._k=k;sfx.count()}}cur.update&&cur.update(t,dt);if(cur.lock){const gb=$('go'),hide=!!cur.T0&&!cur.ask;if(gb.hidden!==hide)gb.hidden=hide;if(gb.disabled===!!cur.ready)gb.disabled=!cur.ready}}
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const gr=ctx.createLinearGradient(0,0,W*.4,H);gr.addColorStop(0,'#e4f2ff');gr.addColorStop(.55,'#f1eaff');gr.addColorStop(1,'#ffe8f3');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  const m=Math.max(W,H);ctx.globalAlpha=.45;
  for(const b of BLOBS){const bx=b.x*W+Math.sin(bgT*b.sp+b.ph)*30,by=b.y*H+Math.cos(bgT*b.sp*.8+b.ph)*30,r=b.r*m*1.3,rg=ctx.createRadialGradient(bx,by,0,bx,by,r);
    rg.addColorStop(0,b.c);rg.addColorStop(1,b.c+'00');ctx.fillStyle=rg;ctx.fillRect(bx-r,by-r,r*2,r*2)}
  ctx.globalAlpha=1;
  const {x,y,s}=card,rad=Math.min(36,s*.07);
  if(phase!=='title'&&phase!=='summary'||cur){
    ctx.save();ctx.shadowColor='rgba(80,60,160,.16)';ctx.shadowOffsetY=8;ctx.shadowBlur=0;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,s,s,rad):ctx.rect(x,y,s,s);ctx.fill();ctx.restore();
    ctx.save();ctx.shadowColor='rgba(80,60,160,.12)';ctx.shadowBlur=30;ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,s,s,rad):ctx.rect(x,y,s,s);ctx.fill();ctx.restore();
    if(cur){ctx.save();ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,s,s,rad):ctx.rect(x,y,s,s);ctx.clip();ctx.translate(x,y);ctx.scale(s,s);g=ctx;cur.draw(t);drawTurn(cur,t);ctx.restore()}
  }
  ctx.setTransform(DPR,0,0,DPR,0,0);
  for(const f of fx){f.life-=dt;f.vy+=700*dt;f.vx*=Math.exp(-dt*1.5);f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot+=dt*6;
    ctx.globalAlpha=Math.max(0,Math.min(1,f.life*2));ctx.fillStyle=f.c;ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);ctx.fillRect(-f.r,-f.r*.6,f.r*2,f.r*1.2);ctx.restore()}
  ctx.globalAlpha=1;fx=fx.filter(f=>f.life>0);
  requestAnimationFrame(frame);
}
addEventListener('resize',layout);if(window.visualViewport)visualViewport.addEventListener('resize',layout);
setSound(SND.on,true);
layout();titleScreen();layout();
requestAnimationFrame(frame);
</script>
</body>
