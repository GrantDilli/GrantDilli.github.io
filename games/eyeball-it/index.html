<!doctype html>
<html lang="en">
<head>
<script src="../site-glue.js" data-game="eyeball-it"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Eyeball It!: perception test game | Infinite Games</title><meta name="description" content="Five quick tests of how well your eyes judge angles, colors, counts and sizes. No rulers, just your eyes. Free to play in your browser."><link rel="canonical" href="https://grantdilli.github.io/games/eyeball-it/">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* Neon retro: dark ground, flat neon colors, hard edges, hard offset shadows, a pinch of scanline grit. */
  :root{--bg:#0b0b1a;--panel:#14142c;--line:#2e2e5c;--text:#f2f2ff;--muted:#8d8dbd;
    --pink:#ff2bd6;--cyan:#00e5ff;--lime:#c6ff3d;--green:#39ff8a;--yellow:#ffe14d;--orange:#ff7a1a;--violet:#a06bff;
    --accent:var(--pink);--good:var(--green);
    --display:"Chakra Petch",system-ui,sans-serif;--mono:"Space Mono",ui-monospace,monospace;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);font-family:var(--display);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;
    padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left))}
  .chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
  .chip{background:var(--panel);color:var(--muted);font:700 .86rem var(--mono);text-transform:uppercase;letter-spacing:.04em;border:2px solid var(--line);border-radius:3px;padding:5px 11px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .chip b{color:var(--cyan);font-weight:700}
  .pips{display:inline-flex;gap:3px;vertical-align:middle;margin-left:8px}
  .pips i{width:9px;height:9px;background:var(--line);display:block}
  .pips i.on{background:var(--pink);box-shadow:0 0 8px var(--pink)}.pips i.done{background:var(--cyan)}
  .icons{display:flex;gap:8px;flex:none}
  .hud button{pointer-events:auto}
  button{font:700 1.05rem var(--display);text-transform:uppercase;letter-spacing:.06em;border:0;cursor:pointer;border-radius:3px;transition:transform .06s,box-shadow .06s,opacity .2s;color:inherit}
  button.icon{width:42px;height:42px;padding:0;display:grid;place-items:center;background:var(--panel);color:var(--cyan);border:2px solid var(--line)}
  button.icon:active{transform:translate(2px,2px)}
  button.icon svg{width:22px;height:22px}
  .prompt{position:fixed;left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top)) + 54px);width:max-content;max-width:calc(100% - 24px);margin:0;
    background:var(--panel);border:2px solid var(--line);border-left:4px solid var(--cyan);border-radius:3px;padding:8px 18px;font:500 clamp(1.05rem,4.2vw,1.3rem)/1.25 var(--display);text-align:center;pointer-events:none;transition:opacity .25s}
  .prompt b{color:var(--yellow)}
  .prompt:empty{opacity:0}
  .prompt .tag{display:inline-block;font:700 .7em var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--bg);border-radius:2px;padding:2px 8px;margin-right:10px;vertical-align:2px}
  .prompt.pop{animation:nudge .22s steps(3,end)}
  @keyframes nudge{from{transform:translateX(calc(-50% - 6px))}to{transform:translateX(-50%)}}
  .go{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--pink);color:var(--bg);padding:13px 36px;font-size:1.25rem;box-shadow:5px 5px 0 var(--cyan);min-width:180px}
  .go:active{transform:translateX(-50%) translate(4px,4px);box-shadow:1px 1px 0 var(--cyan)}
  .go[disabled]{opacity:.32;cursor:default;transform:translateX(-50%);box-shadow:5px 5px 0 var(--line)}
  .go.next{background:var(--cyan);box-shadow:5px 5px 0 var(--pink)}
  .go.next:active{box-shadow:1px 1px 0 var(--pink)}
  .go[hidden]{display:none}
  .badge{position:fixed;display:grid;place-items:center;width:96px;height:96px;background:var(--bg);border:3px solid currentColor;box-shadow:5px 5px 0 currentColor;
    transform:rotate(-8deg) scale(0);transition:transform .25s steps(4,end);pointer-events:none;text-align:center;line-height:1;color:var(--cyan)}
  .badge.on{transform:rotate(-8deg) scale(1)}
  .badge b{font:700 2.4rem var(--mono);display:block}
  .badge span{font:700 .78rem var(--display);text-transform:uppercase;letter-spacing:.05em;display:block;margin-top:4px}
  .msg{position:fixed;inset:0;display:grid;place-content:safe center;justify-items:center;gap:12px;padding:16px;text-align:center;
    background:rgba(8,8,22,.72);opacity:0;pointer-events:none;transition:opacity .2s;overflow:auto}
  .msg.on{opacity:1;pointer-events:auto}
  .msg h2{margin:0;font-family:var(--display);font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.02em;font-size:clamp(2.4rem,10vw,3.6rem);line-height:1;
    text-shadow:-3px 0 var(--pink),3px 0 var(--cyan)}
  .msg p{margin:0;color:var(--muted);font:400 .95rem var(--mono)}
  .msg .big{font:500 1.15rem var(--display);color:var(--text)}
  .msg button.cta{background:var(--pink);color:var(--bg);padding:13px 40px;font-size:1.25rem;box-shadow:5px 5px 0 var(--cyan);margin-top:8px}
  .msg button.cta:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--cyan)}
  .msg.on .card{animation:pop .2s steps(3,end)}
  .card{position:relative;display:grid;gap:10px;justify-items:center;background:var(--panel);border:2px solid var(--line);border-radius:3px;padding:26px 28px 28px;width:min(400px,calc(100vw - 32px));box-shadow:8px 8px 0 rgba(255,43,214,.85)}
  .card::before,.card::after{content:"";position:absolute;width:18px;height:18px;border:3px solid var(--cyan)}
  .card::before{top:-6px;left:-6px;border-right:0;border-bottom:0}.card::after{bottom:-6px;right:-6px;border-left:0;border-top:0}
  .eye{width:110px;height:110px}
  .grade{width:96px;height:96px;display:grid;place-items:center;font:700 3.6rem var(--display);color:var(--bg);border-radius:3px;box-shadow:5px 5px 0 var(--text)}
  .rows{width:100%;display:grid;gap:7px;margin:4px 0}
  .row{display:grid;grid-template-columns:72px 1fr 34px;align-items:center;gap:8px;font:700 .9rem var(--mono)}
  .row .nm{text-align:left;font:500 .95rem var(--display);text-transform:uppercase;letter-spacing:.03em}
  .row .bar,.lvl .bar{height:12px;background:#0b0b1a;border:1px solid var(--line);overflow:hidden}
  .row .bar i,.lvl .bar i{display:block;height:100%;width:0;transition:width .7s steps(12,end);
    -webkit-mask:repeating-linear-gradient(90deg,#000 0 7px,transparent 7px 9px);mask:repeating-linear-gradient(90deg,#000 0 7px,transparent 7px 9px)}
  .row .v{text-align:right;font-variant-numeric:tabular-nums}
  .lvl{width:100%;text-align:left;font:500 .95rem var(--display);text-transform:uppercase;letter-spacing:.03em}
  .lvl .bar{height:14px;margin-top:5px}
  .lvl .bar i{background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink))}
  .unlock{border:2px dashed var(--yellow);color:var(--yellow)!important;padding:6px 14px;font-weight:700!important}
  .unlock:empty{display:none}
  .hud,.prompt,.go,.msg .card,.badge{zoom:var(--k,1)}
  .sa,.sb{display:grid;gap:10px;justify-items:center;width:100%}
  @media (max-height:560px) and (min-aspect-ratio:5/4){
    .prompt{top:max(10px,env(safe-area-inset-top));max-width:calc(100% - 480px);font-size:1rem;padding:6px 16px}
    .go{left:auto;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));transform:none;min-width:0;padding:12px 26px}
    .go:active{transform:translate(4px,4px)}.go[disabled]{transform:none}
    .msg .card.sum{grid-template-columns:auto 1fr;width:min(680px,calc(100vw - 32px));align-items:center;gap:6px 24px}
    .msg .card.sum .big{font-size:1rem}
  }
  @keyframes pop{from{transform:translate(-6px,6px);opacity:0}to{transform:none;opacity:1}}
  @media (max-width:520px){.chip{padding:4px 9px;font-size:.78rem}.chip .nm{display:none}button.icon{width:38px;height:38px}.badge{width:80px;height:80px}.badge b{font-size:2rem}}
  @media (max-height:560px){.card{padding:14px 22px 18px;gap:6px}.grade{width:72px;height:72px;font-size:2.6rem}.eye{width:76px;height:76px}}
  @media (prefers-reduced-motion:reduce){.msg.on .card,.prompt.pop{animation:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Perception test"></canvas>
<header class="hud">
  <h1 class="sr">Eyeball It!</h1>
  <div class="chips"><span class="chip" id="prog">Test <b id="tn">1</b>/5<span class="pips" id="pips"></span></span><span class="chip">Eye Lv <b id="lv">1</b></span></div>
  <div class="icons"><button class="icon" id="snd" aria-label="Sound (M)" title="Sound (M)"></button></div>
</header>
<p class="prompt" id="prompt" aria-live="polite"></p>
<div class="badge" id="badge"><div><b id="bs">0</b><span id="bw"></span></div></div>
<button class="go" id="go" hidden>Lock in</button>
<div class="msg" id="msg"><div class="card" id="mcard"></div></div>
<script type="text/plain" data-pg-game>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
const TAU=Math.PI*2,R=Math.random;
const ri=(a,b)=>a+Math.floor(R()*(b-a+1)),pick=a=>a[R()*a.length|0],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>1-Math.pow(1-t,3);
// Score from error: 100 when exact, 50 at the half-score error k, and a long gentle tail.
const lin=(err,k)=>Math.round(100/(1+(err/k)**2));
const PAL=['#ff2bd6','#ffe14d','#39ff8a','#00e5ff','#a06bff','#ff7a1a','#c6ff3d','#ff5c8a'];

// ---- tests ----
// Each test draws in card units: (0,0) is the card's top-left, (1,1) its bottom-right.
const TESTS={
  count:{name:'Count',col:'#ff2bd6',make:mkCount},
  angle:{name:'Angle',col:'#00e5ff',make:mkAngle},
  split:{name:'Split',col:'#c6ff3d',make:mkSplit},
  catch:{name:'Catch',col:'#ff7a1a',make:mkCatch},
  color:{name:'Color',col:'#a06bff',make:mkColor},
  beat:{name:'Beat',col:'#ff5c8a',make:mkBeat},
  size:{name:'Size',col:'#ffe14d',make:mkSize},
  center:{name:'Center',col:'#00e5ff',make:mkCenter},
  length:{name:'Length',col:'#7dff4d',make:mkLength},
  line:{name:'Line Up',col:'#ff2bd6',make:mkLine},
};
const ORDER=['count','angle','split','catch','color','beat','size','center','length','line'];

let g=ctx,S=300; // g draws in card units
function lw(px){return px/S}
// Neon glow: bright flat colors get a soft halo, dark ones stay crisp.
const GL={};function glow(c){if(typeof c!=='string'||c[0]!=='#'){g.shadowBlur=0;return}
  let v=GL[c];if(v==null){const n=parseInt(c.length===4?c.slice(1).replace(/./g,'$&$&'):c.slice(1,7),16);const r=n>>16&255,gg=n>>8&255,b=n&255;v=GL[c]=Math.max(r,gg,b)>200&&Math.max(r,gg,b)-Math.min(r,gg,b)>90}
  if(v){g.shadowColor=c;g.shadowBlur=GLOW}else g.shadowBlur=0}
let GLOW=10;
function circ(x,y,r,fill,stroke,w){g.beginPath();g.arc(x,y,Math.max(0,r),0,TAU);if(fill){glow(fill);g.fillStyle=fill;g.fill()}if(stroke){glow(stroke);g.strokeStyle=stroke;g.lineWidth=w||lw(3);g.stroke()}g.shadowBlur=0}
function seg(x1,y1,x2,y2,col,w,dash){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);glow(col);g.strokeStyle=col;g.lineWidth=w;g.lineCap='butt';g.setLineDash(dash?[dash,dash*.8]:[]);g.stroke();g.setLineDash([]);g.shadowBlur=0}
function txt(s,x,y,size,col,weight,align){g.save();g.scale(1/S,1/S);g.font=`${weight||700} ${Math.round(size*S)}px "Chakra Petch",sans-serif`;g.fillStyle=col||'#f2f2ff';g.textAlign=align||'center';g.textBaseline='middle';g.fillText(s,x*S,y*S);g.restore()}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function cloud(x0,x1,y0,y1,col){const w=x1-x0,h=y1-y0;g.fillStyle=col;g.fillRect(x0,y0,w,h);
  g.save();g.beginPath();g.rect(x0,y0,w,h);g.clip();g.strokeStyle='#2e2e5c';g.lineWidth=lw(3);g.beginPath();
  for(let k=-h;k<w;k+=.035){g.moveTo(x0+k,y0);g.lineTo(x0+k+h,y1)}g.stroke();g.restore();g.strokeStyle='#4a4a80';g.lineWidth=lw(3);g.strokeRect(x0,y0,w,h)}
// 3-2-1 before anything is shown, so the player knows exactly when to look.
function countdown(t,T0,label){const step=T0/3,i=Math.min(2,Math.floor(t/step)),k=ease(clamp((t-i*step)/(step*.5),0,1));
  circ(.5,.46,(.13+.03*(1-k))*(.6+.4*k),'#20204a');txt(String(3-i),.5,.465,.13*(.6+.4*k),'#a06bff',700);txt(label,.5,.68,.055,'#8d8dbd',700)}
// The switch from watching to playing: a pop-up "Your turn!" and a new prompt.
function turn(o,t,msg){o.turnAt=t;setPrompt(msg);sfx.turn()}
function drawTurn(o,t){if(o.turnAt==null||o.rev)return;const k=t-o.turnAt;if(k>1.1)return;
  const a=k<.8?1:1-(k-.8)/.3,sc=.6+.4*ease(clamp(k/.25,0,1))+(k<.35?.06*Math.sin(k/.35*Math.PI):0);
  g.save();g.globalAlpha=Math.max(0,a);g.translate(.5,.18);g.scale(sc,sc);g.rotate(-.05);
  g.fillStyle='#00e5ff';g.fillRect(-.235,-.055,.48,.13);g.fillStyle='#ff2bd6';g.fillRect(-.245,-.065,.48,.13);txt('YOUR TURN!',-.005,-.002,.06,'#0b0b1a',700);g.restore()}

// Slider: horizontal, value null until touched.
function Slider(o){return Object.assign({x0:.16,x1:.84,y:.86,v:null,min:0,max:1,step:0,drag:false,rainbow:false,col:'#ff2bd6'},o)}
function slSet(sl,p){let f=clamp((p.x-sl.x0)/(sl.x1-sl.x0),0,1),v=sl.min+f*(sl.max-sl.min);if(sl.step)v=Math.round(v/sl.step)*sl.step;sl.v=v}
function slDown(sl,p){if(Math.abs(p.y-sl.y)<.1&&p.x>sl.x0-.06&&p.x<sl.x1+.06){sl.drag=true;slSet(sl,p);return true}return false}
function slDraw(sl){const y=sl.y,w=lw(14);
  if(sl.rainbow){const gr=g.createLinearGradient(sl.x0,0,sl.x1,0);for(let i=0;i<=12;i++)gr.addColorStop(i/12,`hsl(${i*30},95%,60%)`);seg(sl.x0,y,sl.x1,y,gr,w*1.6)}
  else{seg(sl.x0,y,sl.x1,y,'#262650',w);if(sl.v!=null)seg(sl.x0,y,sl.x0+(sl.x1-sl.x0)*(sl.v-sl.min)/(sl.max-sl.min),y,sl.col,w)}
  const f=sl.v==null?.5:(sl.v-sl.min)/(sl.max-sl.min),x=sl.x0+(sl.x1-sl.x0)*f;
  circ(x,y+lw(3),lw(19),'rgba(0,0,0,.45)');circ(x,y,lw(19),'#0b0b1a',sl.v==null?'#4a4a80':(sl.rainbow?'#f2f2ff':sl.col),lw(4));
  if(sl.v==null){const a=.5+.5*Math.sin(now*5);txt('drag',x,y-lw(36),.04,`rgba(141,141,189,${.5+a*.5})`,700)}}

function mkCount(d){
  const lo=Math.round(5+d*11),hi=Math.round(11+d*32),n=ri(lo,hi),dots=[];let tries=0;
  while(dots.length<n&&tries<8000){tries++;const a=R()*TAU,q=Math.sqrt(R())*.38,r=(.016+R()*.016)*(1.15-d*.3),x=.5+Math.cos(a)*q,y=.42+Math.sin(a)*q*.86;
    if(dots.every(o=>Math.hypot(o.x-x,o.y-y)>o.r+r+.014))dots.push({x,y,r,c:pick(PAL)})}
  const N=dots.length,flash=1.6-d*.7,T0=1.5,max=Math.max(30,Math.ceil(N*1.7/10)*10);
  const sl=Slider({min:0,max,step:1,col:'#ff2bd6'});
  return{lock:true,T0,prompt:'Count the dots! They vanish fast…',
    update(t){if(t>=T0&&!this.s){this.s=1;sfx.flash()}if(t>=T0+flash+.3&&!this.ask){this.ask=1;this.ready=false;turn(this,t,'How many dots were there?')}this.ready=sl.v!=null},
    draw(t){if(t<T0){countdown(t,T0,'Get ready to count');return}
      const gone=this.rev?1:clamp((t-T0-flash)/.25,0,1),pop=clamp((t-T0)/.12,0,1);
      if(gone<1||this.rev){g.globalAlpha=this.rev?.55:1;const k=this.rev?1:pop*(1-ease(gone));dots.forEach(o=>circ(o.x,o.y,o.r*k,o.c));g.globalAlpha=1}
      if(this.ask){
        if(!this.rev){txt(sl.v==null?'?':String(sl.v),.5,.42,.2,'#f2f2ff',700)}
        else{g.save();g.scale(1/S,1/S);g.font=`700 ${Math.round(.2*S)}px "Chakra Petch",sans-serif`;g.textAlign='center';g.textBaseline='middle';g.lineWidth=10;g.strokeStyle='#14142c';g.lineJoin='round';g.strokeText(String(N),.5*S,.42*S);g.restore();txt(String(N),.5,.42,.2,'#39ff8a',700)}
        slDraw(sl);
        [[.06,'−',-1],[.94,'+',1]].forEach(([x,s])=>{circ(x,sl.y,.045,'#20204a');txt(s,x,sl.y+.003,.06,'#8d8dbd',700)})}},
    down(p,t){if(!this.ask)return;
      if(Math.hypot(p.x-.06,p.y-sl.y)<.06||Math.hypot(p.x-.94,p.y-sl.y)<.06){sl.v=clamp((sl.v==null?Math.round(max/2):sl.v)+(p.x<.5?-1:1),0,max);sfx.tick();return}
      if(slDown(sl,p))sfx.tick()},
    move(p){if(sl.drag){const o=sl.v;slSet(sl,p);if(o!==sl.v)sfx.tick()}},up(){sl.drag=false},
    key(k){if(!this.ask)return;if(k==='ArrowRight'||k==='ArrowUp')sl.v=clamp((sl.v??Math.round(max/2))+1,0,max);if(k==='ArrowLeft'||k==='ArrowDown')sl.v=clamp((sl.v??Math.round(max/2))-1,0,max)},
    score(){const e=Math.abs(sl.v-N)/N;return{s:lin(e,.18),txt:`There were ${N}. You said ${sl.v}.`}}};
}

function mkAngle(d){
  const hiA=Math.round(165+d*175),A=ri(3,Math.floor(hiA/5))*5,cx=.5,cy=A>180?.5:.62,L=.36;
  let a=null,drag=false;
  const ang=p=>{let v=Math.atan2(-(p.y-cy),p.x-cx)*180/Math.PI;if(v<0)v+=360;return v};
  return{lock:true,prompt:`Make a <b>${A}°</b> angle`,
    update(){this.ready=a!=null},
    draw(){const cur=a??0,rad=cur*Math.PI/180;
      if(a!=null){g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,L*.55,0,-rad,true);g.closePath();g.fillStyle='rgba(0,229,255,.18)';g.fill()}
      if(this.rev){const tr=A*Math.PI/180;seg(cx,cy,cx+Math.cos(tr)*L,cy-Math.sin(tr)*L,'#39ff8a',lw(10),lw(10))}
      seg(cx,cy,cx+L,cy,'#f2f2ff',lw(12));
      seg(cx,cy,cx+Math.cos(rad)*L,cy-Math.sin(rad)*L,'#00e5ff',lw(12));
      circ(cx,cy,lw(10),'#f2f2ff');
      const hx=cx+Math.cos(rad)*L,hy=cy-Math.sin(rad)*L;circ(hx,hy,lw(20),'#0b0b1a','#00e5ff',lw(5));
      if(a==null){txt('drag the blue arm',.5,.12,.045,'#8d8dbd',700)}},
    down(p){drag=true;a=ang(p);sfx.tick()},move(p){if(drag){const o=Math.round(a/3);a=ang(p);if(Math.round(a/3)!==o)sfx.click()}},up(){drag=false},
    key(k){if(k==='ArrowLeft'||k==='ArrowUp')a=((a??0)+1)%360;if(k==='ArrowRight'||k==='ArrowDown')a=((a??0)+359)%360},
    score(){let e=Math.abs(a-A);e=Math.min(e,360-e);return{s:lin(e,12),txt:`Target ${A}°. Yours was ${Math.round(a)}°.`}}};
}

function mkSplit(d){

function mkBeat(d){

      if(this.rev){const x=tt=>.08+(tt-T0)/(exp[7]+I-T0)*.84;seg(.06,.92,.94,.92,'#262650',lw(6));
        guide.concat(exp).forEach(tt=>seg(x(tt),.89,x(tt),.95,'#39ff8a',lw(4)));taps.forEach(tt=>circ(clamp(x(tt),.04,.96),.92,lw(6),'#f2f2ff'))}},

// ---- round flow ----
let round=[],idx=0,results=[],cur=null,curId='',t=0,now=0,phase='title',W=0,H=0,DPR=1,card={x:0,y:0,s:300},bgT=0,lastReal=0;
function setPrompt(h,pop){const p=$('prompt');p.innerHTML=h;p.classList.remove('pop');void p.offsetWidth;p.classList.add('pop')}
function pips(){$('tn').textContent=Math.min(idx+1,5);$('pips').innerHTML=round.map((_,i)=>`<i class="${i<idx?'done':i===idx?'on':''}"></i>`).join('')}
function startRound(){
  const n=unlockedN(),pool=ORDER.slice(0,n),fresh=save.rounds>0&&n>5&&n<=ORDER.length&&5+save.rounds-1<ORDER.length?ORDER[n-1]:null;
  const ranked=pool.filter(id=>id!==fresh).map(id=>({id,k:(save.plays[id]||0)+R()*1.5})).sort((a,b)=>a.k-b.k).map(o=>o.id);
  round=(fresh?[fresh]:[]).concat(ranked).slice(0,5);
  for(let i=round.length-1;i>0;i--){const j=R()*(i+1)|0;[round[i],round[j]]=[round[j],round[i]]}
  idx=0;results=[];hideMsg();track('progression_started',{step_id:'round',step_index:save.rounds+1});startTest();
}
function diff(){return clamp(save.rounds/12,0,1)}
function startTest(){
  curId=round[idx];cur=TESTS[curId].make(diff());t=0;phase='play';pips();
  setPrompt(`<span class="tag" style="background:${TESTS[curId].col}">${TESTS[curId].name}</span>${cur.prompt}`);
  $('badge').classList.remove('on');
  const go=$('go');go.className='go';go.textContent='Lock in';go.hidden=!cur.lock;go.disabled=true;
}
function lockIn(){
  if(phase!=='play'||!cur)return;
  if(cur.lock&&!cur.ready)return;
  const r=cur.score();r.s=clamp(r.s|0,0,100);r.id=curId;results.push(r);cur.rev=1;phase='reveal';
  save.plays[curId]=(save.plays[curId]||0)+1;track('test_completed',{test_id:curId,step_index:idx+1,score:r.s});if(r.s>(save.bestT[curId]||0))save.bestT[curId]=r.s;persist();
  sfx.lock();setTimeout(()=>sfx.score(r.s),180);
  $('bs').textContent=r.s;$('bs').style.color=scoreCol(r.s);$('bw').textContent=word(r.s);$('bw').style.color=scoreCol(r.s);$('badge').style.color=scoreCol(r.s);
  setTimeout(()=>$('badge').classList.add('on'),120);
  setPrompt(r.txt);
  if(r.s>=85)burst(card.x+card.s*.5,card.y+card.s*.45,r.s>=95?40:22);
  const go=$('go');go.hidden=false;go.disabled=false;go.className='go next';go.textContent=idx<4?'Next ›':'See score ›';
}
function next(){if(phase!=='reveal')return;idx++;if(idx<round.length)startTest();else summary()}
function word(s){return s>=95?'Perfect!':s>=85?'Amazing!':s>=70?'Great!':s>=50?'Good':s>=25?'Close-ish':'Oops!'}
function scoreCol(s){return s>=85?'#39ff8a':s>=70?'#00e5ff':s>=50?'#ffe14d':'#ff2bd6'}
function grade(s){return s>=95?['S','#a06bff']:s>=85?['A','#39ff8a']:s>=70?['B','#00e5ff']:s>=55?['C','#ffe14d']:s>=40?['D','#ff7a1a']:['F','#ff2bd6']}

function summary(){
  phase='summary';$('go').hidden=true;$('badge').classList.remove('on');setPrompt('');
  const tot=Math.round(results.reduce((a,r)=>a+r.s,0)/results.length),[G,gc]=grade(tot),before=lvlInfo(save.xp),nb=tot>save.best,prevN=unlockedN();
  save.rounds++;save.xp+=tot;if(nb)save.best=tot;persist();
  const after=lvlInfo(save.xp),n=unlockedN(),unl=n>prevN?TESTS[ORDER[n-1]]:null;
  $('lv').textContent=after.L;
  track('progression_completed',{step_id:'round',step_index:save.rounds,score:tot,grade:G});if(unl)track('test_unlocked',{test_id:ORDER[n-1]});if(after.L>before.L)track('level_up',{eye_level:after.L});
  const rows=results.map(r=>`<div class="row"><span class="nm">${TESTS[r.id].name}</span><span class="bar"><i data-w="${r.s}" style="background:${TESTS[r.id].col}"></i></span><span class="v">${r.s}</span></div>`).join('');
  $('mcard').className='card sum';
  $('mcard').innerHTML=`<div class="sa"><div class="grade" style="background:${gc}">${G}</div>
    <h2>${tot}<span style="font-size:.4em;color:#8d8dbd;text-shadow:none;font-family:var(--mono)"> /100</span></h2>
    <p class="big">${nb&&save.rounds>1?'New best score!':tot>=85?'Those are sharp eyes!':tot>=60?'Nice eyeballing!':'Your eyes are warming up!'}</p></div>
    <div class="sb"><div class="rows">${rows}</div>
    <div class="lvl">Eye Lv ${after.L} · ${title(after.L)}${after.L>before.L?' <span style="color:#ff2bd6">Level up!</span>':''}<span style="float:right;color:#8d8dbd">Best ${save.best}</span><div class="bar"><i style="width:${before.L<after.L?0:before.into/before.need*100}%"></i></div></div>
    <p class="unlock">${unl?`New test unlocked: ${unl.name}!`:''}</p>
    <button class="cta" id="again">Play again</button></div>`;
  showMsg();$('again').onclick=()=>{sfx.lock();startRound()};
  setTimeout(()=>{document.querySelectorAll('.row .bar i').forEach(i=>i.style.width=i.dataset.w+'%');const b=document.querySelector('.lvl .bar i');if(b)b.style.width=(after.into/after.need*100)+'%'},250);
  sfx.fanfare();if(tot>=70)burst(W/2,H*.3,50);
  window.pgBreak&&pgBreak();
}
function titleScreen(){
  phase='title';$('go').hidden=true;setPrompt('');pips();
  const L=lvlInfo(save.xp).L;$('lv').textContent=L;
  $('mcard').className='card';
  $('mcard').innerHTML=`<svg class="eye" viewBox="0 0 100 100"><path d="M4 50 Q50 6 96 50 Q50 94 4 50Z" fill="#0b0b1a" stroke="#00e5ff" stroke-width="5" stroke-linejoin="miter"/><circle cx="50" cy="50" r="19" fill="#ff2bd6"/><circle cx="50" cy="50" r="9" fill="#0b0b1a"/><rect x="55" y="38" width="7" height="7" fill="#fff"/></svg>
    <h2>Eyeball It!</h2><p class="big">Five quick tests of your eyes.<br>How sharp are you?</p>
    ${save.rounds?`<p>Best ${save.best} · Eye Lv ${L} ${title(L)}</p>`:'<p>No rulers. No numbers. Just your eyes.</p>'}
    <button class="cta" id="play">Play</button>`;
  showMsg();$('play').onclick=()=>{sfx.lock();startRound()};
}
function showMsg(){$('msg').classList.add('on')}
function hideMsg(){$('msg').classList.remove('on')}

// ---- confetti ----
let fx=[];
function burst(x,y,n){for(let i=0;i<n;i++){const a=R()*TAU,v=200+R()*420;fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-220,r:4+R()*5,c:pick(PAL),life:1+R()*.6,rot:R()*TAU})}}

// ---- input ----
function unit(e){return{x:(e.clientX-card.x)/card.s,y:(e.clientY-card.y)/card.s}}
function clockAt(){return now+Math.min(.05,(performance.now()-lastReal)/1000)}
cv.addEventListener('pointerdown',e=>{SND.armed=true;if(phase!=='play'||!cur)return;
  if(cur.turnAt!=null&&t-cur.turnAt<.3&&curId!=='beat')return;try{cv.setPointerCapture(e.pointerId)}catch(_){}const p=unit(e);cur.down&&cur.down(p,t+(clockAt()-now))});
cv.addEventListener('pointermove',e=>{if(phase==='play'&&cur&&cur.move)cur.move(unit(e))});
const up=()=>{if(cur&&cur.up)cur.up()};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
$('go').onclick=()=>{SND.armed=true;phase==='play'?lockIn():next()};
$('snd').onclick=()=>{SND.armed=true;setSound(!SND.on)};
addEventListener('pointerdown',()=>{SND.armed=true;if(SND.on)audio()},true);
addEventListener('keydown',e=>{SND.armed=true;
  if(e.key==='m'||e.key==='M'){setSound(!SND.on);return}
  if(e.key==='Enter'||(e.key===' '&&phase!=='play')){e.preventDefault();if(phase==='title'||phase==='summary')startRound();else if(phase==='reveal')next();else lockIn();return}
  if(phase==='play'&&cur&&cur.key){e.preventDefault();cur.key(e.key,t+(clockAt()-now))}});

// ---- layout + frame ----
function layout(){
  DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR|0;cv.height=H*DPR|0;
  const k=clamp(Math.min(W,H)/820,1,1.9);document.documentElement.style.setProperty('--k',k.toFixed(3));
  const short=H<=560&&W/H>=1.25,pr=$('prompt').getBoundingClientRect(),top=short?pr.bottom+10:pr.top+(W<520?78:56)*k,avail=H-top-(short?14:86*k);
  const s=Math.max(160,Math.min(short?W-320:W-24,avail,620*k));card={s,x:(W-s)/2,y:top+Math.max(0,(avail-s)/2)};S=s;
  const b=$('badge'),bw=b.offsetWidth||90;b.style.left=Math.max(4,card.x-bw*.3)+'px';b.style.top=Math.max(card.y-bw*.35,top-bw*.5)+'px';
}
// Backdrop: night sky, a few pixel stars and a slowly scrolling neon floor grid.
const STARS=[...Array(70)].map(()=>({x:R(),y:R()*.62,s:R()<.15?2:1,ph:R()*TAU}));
function drawBg(){
  ctx.fillStyle='#0b0b1a';ctx.fillRect(0,0,W,H);
  for(const st of STARS){ctx.globalAlpha=.35+.35*Math.sin(bgT*1.3+st.ph);ctx.fillStyle='#c9c9ff';ctx.fillRect(st.x*W|0,st.y*H|0,st.s*1.5,st.s*1.5)}
  const hz=H*.62,gr=ctx.createLinearGradient(0,hz,0,H);gr.addColorStop(0,'rgba(255,43,214,0)');gr.addColorStop(1,'rgba(255,43,214,.10)');
  ctx.globalAlpha=1;ctx.fillStyle=gr;ctx.fillRect(0,hz,W,H-hz);
  ctx.strokeStyle='rgba(255,43,214,.32)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,hz+.5);ctx.lineTo(W,hz+.5);
  const vx=W/2,sp=Math.max(W,H)*.09;for(let i=-24;i<=24;i++){ctx.moveTo(vx+i*sp*.25,hz);ctx.lineTo(vx+i*sp*3,H)}
  const f=(bgT*.25)%1;for(let i=0;i<14;i++){const z=Math.pow((i+f)/14,2.4),yy=hz+(H-hz)*z;ctx.moveTo(0,yy|0);ctx.lineTo(W,yy|0)}
  ctx.stroke();ctx.globalAlpha=1}
function frame(ts){
  const real=ts/1000,dt=frame.last?Math.min(.05,Math.max(0,real-frame.last)):0;perfFrame(frame.last?(real-frame.last)*1000:0,phase==='play'||phase==='reveal');frame.last=real;lastReal=performance.now();
  now+=dt;bgT+=dt;
  if(phase==='play'&&cur){t+=dt;if(cur.T0&&t<cur.T0){const k=Math.floor(t/(cur.T0/3));if(k!==cur._k){cur._k=k;sfx.count()}}cur.update&&cur.update(t,dt);if(cur.lock){const gb=$('go'),hide=!!cur.T0&&!cur.ask;if(gb.hidden!==hide)gb.hidden=hide;if(gb.disabled===!!cur.ready)gb.disabled=!cur.ready}}
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawBg();
  const {x,y,s}=card;
  if(phase!=='title'&&phase!=='summary'||cur){
    ctx.fillStyle='rgba(255,43,214,.85)';ctx.fillRect(x+8,y+8,s,s);
    ctx.fillStyle='#14142c';ctx.fillRect(x,y,s,s);ctx.strokeStyle='#2e2e5c';ctx.lineWidth=2;ctx.strokeRect(x+1,y+1,s-2,s-2);
    const c=Math.max(14,s*.05);ctx.strokeStyle='#00e5ff';ctx.lineWidth=3;ctx.beginPath();
    ctx.moveTo(x-5,y-5+c);ctx.lineTo(x-5,y-5);ctx.lineTo(x-5+c,y-5);ctx.moveTo(x+s+5-c,y+s+5);ctx.lineTo(x+s+5,y+s+5);ctx.lineTo(x+s+5,y+s+5-c);ctx.stroke();
    if(cur){ctx.save();ctx.beginPath();ctx.rect(x,y,s,s);ctx.clip();ctx.translate(x,y);ctx.scale(s,s);g=ctx;GLOW=10*DPR;cur.draw(t);drawTurn(cur,t);ctx.restore()}
  }
  ctx.setTransform(DPR,0,0,DPR,0,0);
  for(const f of fx){f.life-=dt;f.vy+=700*dt;f.vx*=Math.exp(-dt*1.5);f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot+=dt*6;
    ctx.globalAlpha=Math.max(0,Math.min(1,f.life*2));ctx.fillStyle=f.c;ctx.save();ctx.translate(f.x|0,f.y|0);ctx.fillRect(-f.r,-f.r,f.r*1.6,f.r*1.6);ctx.restore()}
  ctx.globalAlpha=1;fx=fx.filter(f=>f.life>0);
  requestAnimationFrame(frame);
}
addEventListener('resize',layout);if(window.visualViewport)visualViewport.addEventListener('resize',layout);
setSound(SND.on,true);
layout();titleScreen();layout();
requestAnimationFrame(frame);
</script>
</body>
