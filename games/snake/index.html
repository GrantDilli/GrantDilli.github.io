<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Snake · Infinite Games</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500&display=swap">
<link rel="stylesheet" href="../../style.css">
<style>
  main{max-width:420px;margin:0 auto;padding-block:24px 40px;display:grid;gap:12px;justify-items:center;text-align:center}
  h1{margin:0;font-family:var(--display);font-weight:400;color:var(--lime);font-size:2.4rem}
  .bar{display:flex;justify-content:space-between;width:100%;color:var(--muted);font-variant-numeric:tabular-nums}
  .bar b{color:var(--text)}
  canvas{background:#0b0a12;border:2px solid var(--line);border-radius:6px;width:100%;max-width:100%;aspect-ratio:1;touch-action:none}
  button{background:var(--lime);color:var(--bg);border:0;border-radius:6px;padding:10px 24px;font:400 1rem var(--display);cursor:pointer}
  .back{justify-self:start;color:var(--muted)}
  .hint{color:var(--muted);margin:0;font-size:.9rem}
</style>
</head>
<body>
<main>
  <a class="back" href="../../index.html">← All games</a>
  <h1>Snake</h1>
  <div class="bar"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span></div>
  <canvas id="c" width="420" height="420"></canvas>
  <button id="start">Start</button>
  <p class="hint">Arrow keys / WASD to steer, Space to pause. Swipe on phones.</p>
</main>
<script>
const N=21,S=20,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),btn=document.getElementById('start');
let best=0;try{best=+localStorage.getItem('snakeBest')||0}catch(e){}
bestEl.textContent=best;
let snake,dir,queue,food,score,timer,paused,alive=false;
function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};queue=[];score=0;scoreEl.textContent=0;placeFood();paused=false;alive=true}
function placeFood(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}
function speed(){return Math.max(60,140-score*3)}
function tick(){
  if(!alive||paused)return;
  if(queue.length)dir=queue.shift();
  const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y))return over();
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){score++;scoreEl.textContent=score;placeFood()}else snake.pop();
  draw();timer=setTimeout(tick,speed());
}
function over(){alive=false;if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('snakeBest',best)}catch(e){}}draw();
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,420,420);ctx.fillStyle='#fff';ctx.textAlign='center';
  ctx.font='bold 32px system-ui';ctx.fillText('Game over',210,200);ctx.font='18px system-ui';ctx.fillText('Score '+score,210,232);btn.textContent='Play again'}
function draw(){
  ctx.clearRect(0,0,420,420);
  ctx.fillStyle='#ff5c8a';ctx.beginPath();ctx.arc(food.x*S+S/2,food.y*S+S/2,S/2-2,0,7);ctx.fill();
  snake.forEach((p,i)=>{ctx.fillStyle=i?'#6ee7b7':'#a7f3d0';ctx.fillRect(p.x*S+1,p.y*S+1,S-2,S-2)});
}
function turn(x,y){const last=queue.length?queue[queue.length-1]:dir;if(last.x===-x&&last.y===-y||last.x===x&&last.y===y)return;if(queue.length<3)queue.push({x,y})}
function start(){clearTimeout(timer);reset();btn.textContent='Restart';draw();timer=setTimeout(tick,speed())}
btn.onclick=start;
const keys={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
addEventListener('keydown',e=>{const k=keys[e.key.length===1?e.key.toLowerCase():e.key];
  if(k){e.preventDefault();if(!alive)start();turn(...k)}
  else if(e.key===' '){e.preventDefault();if(alive){paused=!paused;if(!paused)tick()}else start()}});
let tx,ty;cv.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
cv.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20){if(!alive)start();return}
  if(!alive)start();Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy))});
ctx.fillStyle='#a39fbe';ctx.textAlign='center';ctx.font='20px system-ui';ctx.fillText('Press Start or an arrow key',210,215);
</script>
</body>
</html>
