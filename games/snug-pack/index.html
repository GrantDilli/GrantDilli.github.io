<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Snug Pack: suitcase packing puzzle | Infinite Games</title><meta name="description" content="Drag, drop and turn every item until the whole suitcase fits. A calm packing puzzle with endless trips, free in your browser."><link rel="canonical" href="https://grantdilli.github.io/games/snug-pack/">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root{--text:#3b2a5c;--muted:#7a6f9c;--accent:#ff5fa2;--accent-dk:#d93f82;
    --display:"Fredoka","Nunito",system-ui,sans-serif;--body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#e6f3ff;color:var(--text);font-family:var(--body);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

    padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left))}
  .chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
  .chip{background:rgba(255,255,255,.9);color:var(--muted);font-weight:700;border-radius:999px;padding:5px 15px;box-shadow:0 3px 0 rgba(80,60,160,.14);white-space:nowrap;font-variant-numeric:tabular-nums}
  .chip b{color:var(--text);font-weight:800}
  .icons{display:flex;gap:8px;flex:none}
  .hud button{pointer-events:auto}
  button{font:600 1.05rem var(--display);border:0;cursor:pointer;border-radius:999px;transition:transform .08s,box-shadow .08s}
  button.icon{width:44px;height:44px;padding:0;display:grid;place-items:center;background:rgba(255,255,255,.94);color:var(--text);box-shadow:0 4px 0 rgba(80,60,160,.2)}
  button.icon:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(80,60,160,.2)}
  button.icon svg{width:22px;height:22px}
  .tip{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));max-width:calc(100% - 24px);width:max-content;margin:0;
    background:rgba(255,255,255,.9);border-radius:999px;padding:6px 18px;box-shadow:0 3px 0 rgba(80,60,160,.14);pointer-events:none;font-weight:700;text-align:center;transition:opacity .4s}
  .tip:empty{opacity:0}
  .msg{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;padding:16px;text-align:center;
    background:rgba(255,248,252,.55);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .35s}
  .msg.on{opacity:1;pointer-events:auto}
  .msg h2{margin:0;font-family:var(--display);font-weight:700;color:var(--accent);font-size:clamp(2.2rem,9vw,3.4rem);line-height:1.05;text-shadow:0 4px 0 #ffd0e5}
  .msg p{margin:0;color:var(--muted);font-weight:700;font-size:1.1rem}
  .msg button{background:var(--accent);color:#fff;padding:12px 30px;font-size:1.25rem;box-shadow:0 5px 0 var(--accent-dk);margin-top:6px}
  .msg button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-dk)}
  .msg.on .card{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}

  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
  @media (max-width:520px){.chip{padding:4px 11px;font-size:.92rem}.chip .nm{display:none}button.icon{width:40px;height:40px}.tip{font-size:.92rem;border-radius:18px;width:auto}}
  @media (prefers-reduced-motion:reduce){.msg.on .card{animation:none}}
</style>

<body>
<canvas id="c" aria-label="Suitcase packing puzzle"></canvas>
<header class="hud">
  <h1 class="sr">Snug Pack</h1>
  <div class="chips"><span class="chip">Trip <b id="lvl">1</b><span class="nm"> · <b id="lname"></b></span></span><span class="chip"><b id="cnt">0/0</b> packed</span></div>
  <div class="icons"><button class="icon" id="restart" aria-label="Unpack everything" title="Unpack everything"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg></button><button class="icon" id="snd" aria-label="Sound (M)" title="Sound (M)"></button></div>
</header>
<p class="tip" id="tip"></p>
<div class="msg" id="msg"><div class="card"><h2 id="mt"></h2><p id="mp"></p><button id="mb"></button></div></div>
<script type="text/plain" data-pg-game>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
const TAU=Math.PI*2,touchy=matchMedia('(pointer:coarse)').matches;
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ease=t=>1-Math.pow(1-t,3);

// ---- looks ----
const THEMES=[
  {body:'#ff9cc2',dark:'#ec77a4',lining:'#fff3f8',slot:'#ffe2ee',bg:['#dff1ff','#ffe8f4']},
  {body:'#79dcc6',dark:'#52c0a8',lining:'#f0fcf8',slot:'#d5f4ea',bg:['#e4fbf3','#fff4dc']},
  {body:'#ad9cff',dark:'#8e7aef',lining:'#f6f3ff',slot:'#e7e1ff',bg:['#efe9ff','#ffe9f2']},
  {body:'#84c8ff',dark:'#5eaaeb',lining:'#eff8ff',slot:'#d9edff',bg:['#ddf3ff','#effff0']},
  {body:'#ffb487',dark:'#f19461',lining:'#fff5ee',slot:'#ffe5d4',bg:['#fff1e2','#ffe7f1']},
  {body:'#ffd466',dark:'#ecb73e',lining:'#fffaeb',slot:'#fff0c6',bg:['#fffbe0','#e3f4ff']},
];
const PC=[['#ff8fab','#e46c8b'],['#ffd166','#e5b23f'],['#7ee0c3','#54c2a3'],['#8ecbff','#62acea'],['#b9a3ff','#9880ef'],['#ffb38a','#eb9263'],['#b8e986','#93cd5d'],['#f7a1d6','#df7dbc'],['#9be7f0','#6fcad6']];
const NAMES=['Sleepover','Beach Day','Picnic','Camping','Ski Trip',"Grandma's House",'Road Trip','Island Hop','City Break','Theme Park','Lake Cabin','Desert Camp','Cruise','Safari','Space Camp','Treehouse','Snow Fort','Rainforest','Mountain Hut','Festival','Lighthouse','Hot Springs','Moon Base','Hot Air Balloon'];

// ---- levels: every suitcase is cut into pieces, so a perfect fit always exists ----
// [width, height, smallest piece, largest piece, blocked cells (already packed)]
const SPECS=[[3,2,3,3,0],[3,3,3,3,0],[4,3,3,4,0],[4,4,3,4,0],[5,3,3,4,0],[5,4,3,4,0],[4,4,2,5,1],[5,5,3,4,1],[6,4,3,5,0],[6,5,3,5,2],
  [5,5,4,5,0],[6,6,3,5,2],[7,4,3,5,0],[7,5,4,5,1],[6,6,4,5,0],[7,6,3,5,2],[8,5,4,5,0],[7,7,3,5,3],[8,6,4,5,2],[8,7,4,5,0]];
function boxOK(cells,w){let x0=99,x1=-1,y0=99,y1=-1;for(const i of cells){const x=i%w,y=i/w|0;x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}return x1-x0<3&&y1-y0<3}
function tryGen(w,h,mn,mx,blk,r){
  const N=w*h,open=Array(N).fill(1),id=Array(N).fill(-1),regs=[];
  for(let i=0;i<blk;i++)open[r()*N|0]=0;
  const nb=i=>{const x=i%w,o=[];if(x>0)o.push(i-1);if(x<w-1)o.push(i+1);if(i>=w)o.push(i-w);if(i<N-w)o.push(i+w);return o};
  const free=i=>open[i]&&id[i]<0,deg=i=>nb(i).filter(free).length;
  for(;;){
    let best=-1,bd=99;for(let i=0;i<N;i++)if(free(i)){const d=deg(i)+r()*.6;if(d<bd){bd=d;best=i}}
    if(best<0)break;
    const k=regs.length,target=mn+(r()*(mx-mn+1)|0),reg=[best];id[best]=k;
    while(reg.length<target){
      const fr=[];reg.forEach(c=>nb(c).forEach(j=>{if(free(j)&&!fr.includes(j)&&boxOK(reg.concat(j),w))fr.push(j)}));
      if(!fr.length)break;
      const sc=fr.map(j=>[j,deg(j)+r()*1.6]).sort((a,b)=>a[1]-b[1]);
      id[sc[0][0]]=k;reg.push(sc[0][0]);
    }
    regs.push(reg);
  }
  for(let k=0;k<regs.length;k++){const reg=regs[k];if(!reg||reg.length>=mn)continue;let done=false;
    for(const c of reg){for(const j of nb(c)){const o=id[j];
      if(o>=0&&o!==k&&regs[o]&&regs[o].length+reg.length<=mx&&boxOK(regs[o].concat(reg),w)){regs[o]=regs[o].concat(reg);reg.forEach(c=>id[c]=o);regs[k]=null;done=true;break}}if(done)break}
    if(!done)return null}
  const out=regs.filter(Boolean);
  if(out.length<2)return null;
  return {w,h,open,shapes:out.map(g=>norm(g.map(i=>[i%w,i/w|0]))),at:out.map(g=>[Math.min(...g.map(i=>i%w)),Math.min(...g.map(i=>i/w|0))])};
}
function norm(c){const x0=Math.min(...c.map(p=>p[0])),y0=Math.min(...c.map(p=>p[1]));return c.map(p=>[p[0]-x0,p[1]-y0]).sort((a,b)=>a[1]-b[1]||a[0]-b[0])}
function rot(c){return norm(c.map(([x,y])=>[-y,x]))}
function makeLevel(n){
  const seed=4242+n*977;let spec=SPECS[n];
  if(!spec){const r=rng(seed);spec=[6+(r()*3|0),5+(r()*3|0),3+(r()*2|0),5,r()*4|0]}
  for(let a=0;a<600;a++){const r=rng(seed+a*7919),L=tryGen(...spec,r);
    if(L){L.r=r;return L}}
  return {w:2,h:2,open:[1,1,1,1],shapes:[[[0,0],[1,0]],[[0,0],[1,0]]],at:[[0,0],[0,1]],r:rng(1)};
}

// ---- sound: soft, cushioned, all synthesised ----
const SND={on:true,ctx:null};
try{SND.on=localStorage.getItem('snugSound')!=='off'}catch(e){}
function audio(){
  if(!SND.on||!SND.armed)return null;
  if(!SND.ctx){try{const C=window.AudioContext||window.webkitAudioContext,a=new C();SND.ctx=a;
    const comp=a.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=3;comp.connect(a.destination);
    const warm=a.createBiquadFilter();warm.type='lowpass';warm.frequency.value=7000;warm.connect(comp);
    SND.out=a.createGain();SND.out.gain.value=.8;SND.out.connect(warm);
    const len=a.sampleRate*2|0,ir=a.createBuffer(2,len,a.sampleRate);
    for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.4)}
    const cvl=a.createConvolver();cvl.buffer=ir;const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2800;
    SND.rev=a.createGain();SND.rev.gain.value=.4;SND.rev.connect(cvl);cvl.connect(lp);lp.connect(SND.out);
    const nb=a.createBuffer(1,a.sampleRate,a.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;SND.nb=nb;
    if(a.state==='suspended'&&!document.hidden)a.resume();
  }catch(e){SND.on=false;return null}}
  return SND.ctx}
function out(a,g,rev){g.connect(SND.out);if(rev){const s=a.createGain();s.gain.value=rev;g.connect(s);s.connect(SND.rev)}}
function tone(f,o={}){const a=audio();if(!a)return;const {type='sine',t=0,at=.006,d=.3,g=.2,f2,sl=.08,rev=0}=o;
  const t0=a.currentTime+t,osc=a.createOscillator(),G=a.createGain();osc.type=type;
  osc.frequency.setValueAtTime(f,t0);if(f2)osc.frequency.exponentialRampToValueAtTime(f2,t0+sl);
  G.gain.setValueAtTime(0,t0);G.gain.linearRampToValueAtTime(g,t0+at);G.gain.exponentialRampToValueAtTime(.0001,t0+at+d);
  osc.connect(G);out(a,G,rev);osc.start(t0);osc.stop(t0+at+d+.05)}
function hiss(o={}){const a=audio();if(!a)return;const {type='bandpass',t=0,at=.003,d=.1,g=.1,f=2000,f2,q=1,rev=0}=o;
  const t0=a.currentTime+t,src=a.createBufferSource(),F=a.createBiquadFilter(),G=a.createGain();
  src.buffer=SND.nb;F.type=type;F.Q.value=q;F.frequency.setValueAtTime(f,t0);if(f2)F.frequency.exponentialRampToValueAtTime(f2,t0+at+d);
  G.gain.setValueAtTime(0,t0);G.gain.linearRampToValueAtTime(g,t0+at);G.gain.exponentialRampToValueAtTime(.0001,t0+at+d);
  src.connect(F);F.connect(G);out(a,G,rev);src.start(t0,Math.random()*.6);src.stop(t0+at+d+.05)}
const PENT=[0,2,4,7,9];
const note=n=>392*Math.pow(2,(PENT[n%5]+12*Math.floor(n/5))/12);
const jit=()=>1+(Math.random()-.5)*.06;
const sfx={
  pick(k){const f=(520+(k%5)*45)*jit();tone(f*1.45,{f2:f*.85,sl:.07,d:.11,g:.2});hiss({f:3800,q:2.5,d:.025,g:.05});tone(f*2.9,{d:.04,g:.025,t:.012})},
  appear(k){const f=(640+(k%6)*60)*jit();tone(f,{f2:f*1.5,sl:.06,d:.09,g:.09,rev:.25})},
  tick(){hiss({f:4400*jit(),q:3.5,d:.016,g:.04});tone(2300*jit(),{d:.018,g:.012})},
  turn(){hiss({f:600,f2:2600,q:1.3,at:.05,d:.13,g:.11});tone(780*jit(),{f2:1040,sl:.05,d:.08,g:.05,t:.05,rev:.2})},
  place(n){const j=jit();tone(150*j,{f2:58,sl:.14,d:.2,g:.4});hiss({type:'lowpass',f:1300,f2:280,d:.15,g:.16});
    const f=note(Math.min(n,14));tone(f,{type:'triangle',t:.025,d:.8,g:.11,rev:.55});tone(f*2,{t:.025,d:.45,g:.035,rev:.5})},
  nope(){tone(300,{type:'triangle',f2:250,sl:.1,d:.12,g:.09});tone(250,{type:'triangle',f2:205,sl:.1,t:.12,d:.15,g:.07})},
  whoosh(){hiss({type:'lowpass',f:1900,f2:260,at:.05,d:.26,g:.08})},
  unpack(){for(let i=0;i<6;i++)hiss({type:'lowpass',f:1500,f2:300,t:i*.05,at:.03,d:.15,g:.05})},
  zip(dur){const n=28;for(let i=0;i<n;i++){const t=dur*(1-Math.pow(1-i/n,1.5));hiss({t,f:2400+i*90,q:5,d:.011,g:.07})}
    hiss({f:1400,f2:4200,q:2,at:dur*.85,d:dur*.2,g:.035})},
  clack(){tone(430,{type:'triangle',f2:300,sl:.05,d:.1,g:.14});hiss({f:2200,q:1,d:.04,g:.08});tone(110,{f2:60,sl:.1,d:.2,g:.3})},
  chime(){[0,4,7,12,16].forEach((s,i)=>{const f=523.25*Math.pow(2,s/12);tone(f,{t:i*.09,d:1.5,g:.1,rev:.8});tone(f*2.01,{t:i*.09,d:.7,g:.025,rev:.8})});
    [261.63,329.63,392].forEach(f=>tone(f,{type:'triangle',at:.35,d:2.2,g:.035,rev:.7}))},
};
function setSound(on,init){SND.on=on;try{localStorage.setItem('snugSound',on?'on':'off')}catch(e){}
  $('snd').innerHTML=on?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
  $('snd').setAttribute('aria-pressed',on);if(SND.ctx){try{on?SND.ctx.resume():SND.ctx.suspend()}catch(e){}}else if(on&&!init)audio()}

// ---- state ----
let save={lvl:0};
try{Object.assign(save,JSON.parse(localStorage.getItem('snugSave'))||{})}catch(e){}
function persist(){try{localStorage.setItem('snugSave',JSON.stringify(save))}catch(e){}}
let li=0,L,theme,pieces=[],occ=[],drag=null,ghost=null,win=null,overlay=false,fx=[],bubbles=[],W=0,H=0,DPR=1,cs=40,bx=0,by=0,ts=30,trayR=null,clock=0,started=false;

function dims(c){return[Math.max(...c.map(p=>p[0]))+1,Math.max(...c.map(p=>p[1]))+1]}
function faceCell(c){const [w,h]=dims(c),cx=(w-1)/2,cy=(h-1)/2;let b=c[0],bd=1e9;for(const p of c){const d=(p[0]-cx)**2+(p[1]-cy)**2*1.01;if(d<bd){bd=d;b=p}}return b}
function load(i){
  li=i;save.lvl=i;persist();L=makeLevel(i);theme=THEMES[i%THEMES.length];const r=L.r;
  const cols=PC.map((_,k)=>k).sort(()=>r()-.5);
  pieces=L.shapes.map((c,k)=>{let cells=c;if(i>0){const n=r()*4|0;for(let j=0;j<n;j++)cells=rot(cells)}
    return {sol:c,at:L.at[k],cells,face:faceCell(cells),col:PC[cols[k%cols.length]],pat:(k+i)%4,placed:false,gx:0,gy:0,x:0,y:0,s:0,ang:0,bounce:0,wob:0,appear:-k*.07-.15,blink:2+r()*4,k}});
  pieces.sort(()=>r()-.5);pieces.forEach((p,k)=>p.slot=k);
  occ=Array(L.w*L.h).fill(-1);drag=null;ghost=null;win=null;fx=[];
  bubbles=Array.from({length:14},(_,k)=>({x:Math.random(),y:Math.random(),r:.04+Math.random()*.09,v:.004+Math.random()*.01,c:k%PC.length}));
  const T=[touchy?'Drag every item into the suitcase.':'Drag every item into the suitcase.',
    touchy?'Tap an item to turn it.':'Click an item to turn it. Right-click or Space turns it while you drag.',
    touchy?'Tip: tap with a second finger to turn while dragging.':'Tip: the mouse wheel turns the item you are holding.'];
  $('tip').textContent=T[i]||'';
  layout(true);hideMsg();ui();
}
function layout(snap){
  DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  const top=Math.max(64,parseFloat(getComputedStyle(document.querySelector('.hud')).paddingTop)+52),m=14,tipH=$('tip').textContent?46:12;
  const land=W>H*1.08;let A,T;
  if(land){const aw=(W-3*m)*.6;A={x:m,y:top,w:aw,h:H-top-m};T={x:2*m+aw,y:top,w:W-3*m-aw,h:H-top-tipH-m}}
  else{const ah=(H-top-tipH)*.55;A={x:m,y:top,w:W-2*m,h:ah};T={x:m,y:top+ah+6,w:W-2*m,h:H-top-ah-tipH-12}}
  cs=Math.min(A.w/(L.w+1.3),A.h/(L.h+2.1),96);
  bx=A.x+(A.w-L.w*cs)/2;by=A.y+(A.h-L.h*cs)/2+cs*.35;
  // tray: one square slot per item so turning never overflows
  const U=Math.max(...pieces.map(p=>Math.max(...dims(p.cells))))+.7,n=pieces.length;let best=0,bc=1;
  for(let c=1;c<=n;c++){const rws=Math.ceil(n/c),s=Math.min(T.w/c,T.h/rws);if(s>best){best=s;bc=c}}
  ts=Math.min(best/U,cs*.9);const slot=ts*U,rws=Math.ceil(n/bc);
  trayR={x:T.x,y:T.y,w:T.w,h:T.h,ox:T.x+(T.w-slot*bc)/2,oy:T.y+(T.h-slot*rws)/2,slot,cols:bc,rws};
  pieces.forEach(p=>{const t=target(p);if(snap||p.s===0){p.x=t.x;p.y=t.y;p.s=t.s}});
}
function slotC(p){const r=trayR,c=p.slot%r.cols,rw=p.slot/r.cols|0;const lastN=pieces.length-(r.rws-1)*r.cols,shift=rw===r.rws-1?(r.cols-lastN)*r.slot/2:0;
  return[r.ox+(c+.5)*r.slot+shift,r.oy+(rw+.5)*r.slot]}
function target(p){
  if(drag&&drag.p===p)return{x:drag.px-drag.u*cs,y:drag.py-drag.v*cs-drag.lift,s:cs};
  if(p.placed)return{x:bx+p.gx*cs,y:by+p.gy*cs,s:cs};
  const [w,h]=dims(p.cells),[cx,cy]=slotC(p);return{x:cx-w*ts/2,y:cy-h*ts/2,s:ts};
}
function fits(p,gx,gy,cells=p.cells){for(const [x,y] of cells){const X=gx+x,Y=gy+y;if(X<0||Y<0||X>=L.w||Y>=L.h)return false;const i=Y*L.w+X;if(!L.open[i]||(occ[i]>=0&&occ[i]!==p.k))return false}return true}
function setOcc(p,on){for(const [x,y] of p.cells)occ[(p.gy+y)*L.w+p.gx+x]=on?p.k:-1}
function snapSpot(p){const t=target(p),fx=(t.x-bx)/cs,fy=(t.y-by)/cs,rx=Math.round(fx),ry=Math.round(fy);
  const [w,h]=dims(p.cells),cx=t.x+w*cs/2,cy=t.y+h*cs/2,mg=cs*.9;
  if(cx<bx-mg||cy<by-mg||cx>bx+L.w*cs+mg||cy>by+L.h*cs+mg)return null;
  let best=null,bd=1e9;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const gx=rx+dx,gy=ry+dy;if(!fits(p,gx,gy))continue;const d=(gx-fx)**2+(gy-fy)**2;if(d<bd&&d<1.3){bd=d;best={gx,gy}}}
  return best}
const packed=()=>pieces.filter(p=>p.placed).length;
function ui(){$('lvl').textContent=li+1;$('lname').textContent=NAMES[li%NAMES.length];$('cnt').textContent=packed()+'/'+pieces.length}

// ---- input ----
function hit(x,y){
  const list=[...pieces].filter(p=>p.appear>=1&&!(drag&&drag.p===p)).sort((a,b)=>(b.placed?0:1)-(a.placed?0:1));
  for(const p of list){
    if(!p.placed){const [cx,cy]=slotC(p),h=trayR.slot/2;if(Math.abs(x-cx)<h&&Math.abs(y-cy)<h)return p}
    else for(const [a,b] of p.cells){const X=p.x+a*p.s,Y=p.y+b*p.s;if(x>=X&&y>=Y&&x<X+p.s&&y<Y+p.s)return p}
  }return null}
let press=null;
const arm=()=>{if(!SND.armed){SND.armed=true;audio()}};
addEventListener('pointerdown',arm,true);addEventListener('keydown',arm,true);
cv.addEventListener('pointerdown',e=>{
  if(overlay||win)return;
  if(drag){if(e.pointerId!==drag.id){turnHeld();}return}
  const p=hit(e.clientX,e.clientY);if(!p)return;
  if(e.button===2){turn(p);return}
  cv.setPointerCapture(e.pointerId);
  press={p,id:e.pointerId,x:e.clientX,y:e.clientY,type:e.pointerType};
});
cv.addEventListener('pointermove',e=>{
  if(drag&&e.pointerId===drag.id){if(e.button===2)turnHeld();drag.px=e.clientX;drag.py=e.clientY;updGhost();return}
  if(press&&e.pointerId===press.id&&Math.hypot(e.clientX-press.x,e.clientY-press.y)>7)startDrag(e);
});
function startDrag(e){
  const p=press.p;press=null;
  // keep the grabbed spot of the item under the pointer
  let u=(e.clientX-p.x)/p.s,v=(e.clientY-p.y)/p.s;const [w,h]=dims(p.cells);
  if(!p.placed){u=Math.max(.3,Math.min(w-.3,u));v=Math.max(.3,Math.min(h-.3,v))}
  if(p.placed){setOcc(p,false);p.placed=false}
  drag={p,id:e.pointerId,px:e.clientX,py:e.clientY,u,v,lift:0,touch:e.pointerType==='touch'};
  sfx.pick(p.k);$('tip').classList.add('dim');updGhost();ui();
}
function endDrag(){
  const d=drag,p=d.p;drag=null;const g=ghost;ghost=null;
  if(g){p.placed=true;p.gx=g.gx;p.gy=g.gy;setOcc(p,true);p.bounce=1;const n=packed();sfx.place(n-1);
    if(navigator.vibrate&&d.touch)try{navigator.vibrate(8)}catch(e){}
    puff(p);ui();if(n===pieces.length)finish()}
  else{const [w,h]=dims(p.cells),cx=p.x+w*p.s/2,cy=p.y+h*p.s/2;
    if(cx>bx&&cy>by&&cx<bx+L.w*cs&&cy<by+L.h*cs){sfx.nope();p.wob=1}else sfx.whoosh();ui()}
}
cv.addEventListener('pointerup',e=>{
  if(drag&&e.pointerId===drag.id){endDrag();return}
  if(press&&e.pointerId===press.id){const p=press.p;press=null;turn(p)}
});
cv.addEventListener('pointercancel',e=>{if(drag&&e.pointerId===drag.id){ghost=null;endDrag()}press=null});
cv.addEventListener('contextmenu',e=>e.preventDefault());
let lastWheel=0;
cv.addEventListener('wheel',e=>{e.preventDefault();if(drag&&clock-lastWheel>.18){lastWheel=clock;turnHeld()}},{passive:false});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if((k===' '||k==='r')&&drag){e.preventDefault();turnHeld()}
  else if(k==='m')setSound(!SND.on);
  else if((k==='enter'||k===' ')&&overlay){e.preventDefault();$('mb').click()}});
function turnHeld(){
  const d=drag,p=d.p;const [w]=dims(p.cells);
  // rotate the grab point with the item so it stays under the finger
  const nu=(p.cells.reduce((m,c)=>Math.max(m,c[1]),0)+1)-d.v,nv=d.u;
  p.cells=rot(p.cells);p.face=faceCell(p.cells);d.u=nu;d.v=nv;p.ang=-TAU/4;
  const t=target(p);p.x=t.x;p.y=t.y;sfx.turn();updGhost();
}
function turn(p){
  if(!p.placed){p.cells=rot(p.cells);p.face=faceCell(p.cells);p.ang=-TAU/4;const t=target(p);p.x=t.x;p.y=t.y;sfx.turn();return}
  const [w,h]=dims(p.cells),cx=p.gx+w/2,cy=p.gy+h/2,nc=rot(p.cells),[nw,nh]=dims(nc);
  setOcc(p,false);const cand=[];
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const gx=Math.round(cx-nw/2)+dx,gy=Math.round(cy-nh/2)+dy;cand.push([gx,gy,(gx+nw/2-cx)**2+(gy+nh/2-cy)**2])}
  cand.sort((a,b)=>a[2]-b[2]);const ok=cand.find(c=>c[2]<=1.6&&fits(p,c[0],c[1],nc));
  if(ok){p.cells=nc;p.face=faceCell(nc);p.gx=ok[0];p.gy=ok[1];p.ang=-TAU/4;const t=target(p);p.x=t.x;p.y=t.y;setOcc(p,true);sfx.turn()}
  else{setOcc(p,true);p.wob=1;sfx.nope()}
}
let lastGhost='';
function updGhost(){ghost=drag?snapSpot(drag.p):null;const key=ghost?ghost.gx+','+ghost.gy+','+drag.p.cells.join():'';if(key&&key!==lastGhost)sfx.tick();lastGhost=key}

$('restart').onclick=()=>{if(overlay||win||drag)return;let any=false;pieces.forEach(p=>{if(p.placed){setOcc(p,false);p.placed=false;any=true}});if(any)sfx.unpack();ui()};
$('snd').onclick=()=>setSound(!SND.on);setSound(SND.on,true);
function showMsg(t,p,label,fn){overlay=true;$('mt').textContent=t;$('mp').textContent=p;const b=$('mb');b.textContent=label;b.onclick=()=>{audio();fn()};$('msg').classList.add('on');setTimeout(()=>b.focus({preventScroll:true}),50)}
function hideMsg(){overlay=false;$('msg').classList.remove('on')}
function finish(){
  win={t:-.35};window.pgBreak&&pgBreak();
  save.lvl=li+1;persist();
}
const CHEERS=['All packed!','So snug!','Perfect fit!','Zipped up!','Cozy!','Nice packing!'];

// ---- drawing ----
function rr(x,y,w,h,r){ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function shape(cells,s){const g=s*.045,r=s*.3,set=new Set(cells.map(c=>c+''));const has=(x,y)=>set.has(x+','+y);
  ctx.beginPath();
  for(const [x,y] of cells){rr(x*s+g,y*s+g,s-2*g,s-2*g,r);
    if(has(x+1,y))ctx.rect(x*s+s/2,y*s+g,s,s-2*g);
    if(has(x,y+1))ctx.rect(x*s+g,y*s+s/2,s-2*g,s);
    if(has(x+1,y)&&has(x,y+1)&&has(x+1,y+1))ctx.rect(x*s+s/2,y*s+s/2,s,s)}}
function drawPiece(p,now){
  const s=p.s,[w,h]=dims(p.cells),held=drag&&drag.p===p,ap=Math.min(1,Math.max(0,p.appear));if(ap<=0)return;
  ctx.save();
  let pvx=p.x+w*s/2,pvy=p.y+h*s/2;if(held){pvx=drag.px;pvy=drag.py-drag.lift}
  ctx.translate(pvx,pvy);
  const b=p.bounce,sq=b*Math.cos(b*12)*.14,pop=ap<1?1.12*Math.sin(ap*Math.PI/2)+(1-ap)*0:1;
  const sc=(held?1.06:1)*(ap<1?ease(ap)*(1+.25*Math.sin(ap*Math.PI)):1);
  ctx.rotate(p.ang+Math.sin(now*38)*p.wob*.14);ctx.scale(sc*(1+sq),sc*(1-sq));ctx.translate(-pvx,-pvy);
  ctx.translate(p.x,p.y);
  const dep=s*.09;
  if(held||!p.placed){ctx.save();ctx.translate(s*(held?.14:.04),s*(held?.34:.12));shape(p.cells,s);ctx.fillStyle=held?'rgba(80,60,160,.16)':'rgba(80,60,160,.08)';ctx.fill();ctx.restore()}
  ctx.save();ctx.translate(0,dep);shape(p.cells,s);ctx.fillStyle=p.col[1];ctx.fill();ctx.restore();
  shape(p.cells,s);ctx.fillStyle=p.col[0];ctx.fill();
  ctx.save();ctx.clip();
  ctx.fillStyle='rgba(255,255,255,.32)';ctx.strokeStyle='rgba(255,255,255,.3)';
  if(p.pat===1){ctx.lineWidth=s*.11;ctx.beginPath();for(let i=-h;i<w+h;i+=.42){ctx.moveTo(i*s,0);ctx.lineTo((i+h)*s,h*s)}ctx.stroke()}
  else if(p.pat===2){for(let y=0;y<h*3;y++)for(let x=0;x<w*3;x++){ctx.beginPath();ctx.arc((x+.5+(y%2)*.5)*s/3,(y+.5)*s/3,s*.055,0,TAU);ctx.fill()}}
  else if(p.pat===3){ctx.fillStyle='rgba(255,255,255,.2)';for(let y=0;y<h*2;y++)for(let x=0;x<w*2;x++)if((x+y)%2)ctx.fillRect(x*s/2,y*s/2,s/2,s/2)}
  // soft gloss
  ctx.fillStyle='rgba(255,255,255,.45)';const c0=p.cells[0];ctx.beginPath();ctx.ellipse(c0[0]*s+s*.3,c0[1]*s+s*.24,s*.13,s*.07,-.5,0,TAU);ctx.fill();
  ctx.restore();
  // face
  const fx=(p.face[0]+.5)*s,fy=(p.face[1]+.52)*s,z=s*1.3;ctx.fillStyle='#3b2a5c';ctx.strokeStyle='#3b2a5c';ctx.lineCap='round';ctx.lineWidth=Math.max(1.5,z*.045);
  const blink=((now+p.k*1.7)%p.blink)<.13,happy=held||(win&&win.t>0),ex=z*.15,ey=fy-z*.06;
  if(happy){ctx.beginPath();ctx.arc(fx-ex,ey+z*.02,z*.05,Math.PI*1.1,Math.PI*1.9);ctx.moveTo(fx+ex+z*.05*Math.cos(Math.PI*1.1),ey+z*.02+z*.05*Math.sin(Math.PI*1.1));ctx.arc(fx+ex,ey+z*.02,z*.05,Math.PI*1.1,Math.PI*1.9);ctx.stroke()}
  else if(blink){ctx.beginPath();ctx.moveTo(fx-ex-z*.04,ey);ctx.lineTo(fx-ex+z*.04,ey);ctx.moveTo(fx+ex-z*.04,ey);ctx.lineTo(fx+ex+z*.04,ey);ctx.stroke()}
  else{ctx.beginPath();ctx.arc(fx-ex,ey,z*.05,0,TAU);ctx.arc(fx+ex,ey,z*.05,0,TAU);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(fx-ex+z*.017,ey-z*.018,z*.017,0,TAU);ctx.arc(fx+ex+z*.017,ey-z*.018,z*.017,0,TAU);ctx.fill();ctx.fillStyle='#3b2a5c'}
  if(held){ctx.beginPath();ctx.ellipse(fx,fy+z*.1,z*.055,z*.05,0,0,TAU);ctx.fill()}
  else{ctx.beginPath();ctx.arc(fx,fy+z*.06,z*.065,.2*Math.PI,.8*Math.PI);ctx.stroke()}
  ctx.fillStyle='rgba(255,110,150,.35)';ctx.beginPath();ctx.ellipse(fx-z*.27,fy+z*.05,z*.07,z*.045,0,0,TAU);ctx.ellipse(fx+z*.27,fy+z*.05,z*.07,z*.045,0,0,TAU);ctx.fill();
  ctx.restore();
}
function suitcase(now){
  const bw=L.w*cs,bh=L.h*cs,pad=cs*.55,X=bx-pad,Y=by-pad,BW=bw+2*pad,BH=bh+2*pad,R=cs*.6,t=theme;
  // ground shadow, wheels, handle
  ctx.fillStyle='rgba(80,60,160,.1)';ctx.beginPath();ctx.ellipse(X+BW/2,Y+BH+cs*.32,BW*.52,cs*.22,0,0,TAU);ctx.fill();
  ctx.fillStyle=t.dark;for(const wx of [X+R,X+BW-R]){ctx.beginPath();ctx.arc(wx,Y+BH+cs*.12,cs*.17,0,TAU);ctx.fill()}
  const hw=Math.min(bw*.42,cs*2.6),hx=X+BW/2-hw/2;ctx.strokeStyle=t.dark;ctx.lineWidth=cs*.2;ctx.lineJoin='round';
  ctx.beginPath();rr(hx,Y-cs*.55,hw,cs*.75,cs*.3);ctx.stroke();
  ctx.fillStyle=t.dark;ctx.beginPath();rr(hx-cs*.12,Y-cs*.08,cs*.36,cs*.2,cs*.08);rr(hx+hw-cs*.24,Y-cs*.08,cs*.36,cs*.2,cs*.08);ctx.fill();
  // body
  ctx.fillStyle=t.dark;ctx.beginPath();rr(X,Y+cs*.12,BW,BH,R);ctx.fill();
  ctx.fillStyle=t.body;ctx.beginPath();rr(X,Y,BW,BH,R);ctx.fill();
  ctx.save();ctx.setLineDash([cs*.13,cs*.11]);ctx.lineWidth=Math.max(1.5,cs*.05);ctx.strokeStyle='rgba(255,255,255,.65)';
  ctx.beginPath();rr(X+pad*.32,Y+pad*.32,BW-pad*.64,BH-pad*.64,R*.7);ctx.stroke();ctx.restore();
  // lining and cells
  ctx.fillStyle=t.lining;ctx.beginPath();rr(bx-cs*.1,by-cs*.1,bw+cs*.2,bh+cs*.2,cs*.32);ctx.fill();
  for(let y=0;y<L.h;y++)for(let x=0;x<L.w;x++){const i=y*L.w+x,X0=bx+x*cs,Y0=by+y*cs;
    if(L.open[i]){ctx.fillStyle=t.slot;ctx.beginPath();rr(X0+cs*.08,Y0+cs*.08,cs*.84,cs*.84,cs*.24);ctx.fill()}
    else{ // a plush pillow already packed
      ctx.fillStyle=t.dark;ctx.beginPath();rr(X0+cs*.05,Y0+cs*.1,cs*.9,cs*.88,cs*.3);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();rr(X0+cs*.05,Y0+cs*.04,cs*.9,cs*.88,cs*.3);ctx.fill();
      ctx.fillStyle=t.body;const hx2=X0+cs/2,hy=Y0+cs*.5,k=cs*.15;ctx.beginPath();ctx.moveTo(hx2,hy+k*1.1);
      ctx.bezierCurveTo(hx2-k*1.9,hy-k*.2,hx2-k*.9,hy-k*1.6,hx2,hy-k*.55);ctx.bezierCurveTo(hx2+k*.9,hy-k*1.6,hx2+k*1.9,hy-k*.2,hx2,hy+k*1.1);ctx.fill()}}
}
function lid(k){
  const bw=L.w*cs,bh=L.h*cs,pad=cs*.55,X=bx-pad,Y=by-pad,BW=bw+2*pad,BH=bh+2*pad,R=cs*.6,t=theme,h=BH*k;
  if(k<=0)return;
  ctx.save();ctx.beginPath();rr(X,Y,BW,BH,R);ctx.clip();
  ctx.fillStyle=t.dark;ctx.fillRect(X,Y+h-cs*.12,BW,cs*.12);
  ctx.fillStyle=t.body;ctx.fillRect(X,Y,BW,h-cs*.1);
  ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(X,Y,BW,Math.min(h,BH*.12));
  // zipper teeth along the closing edge
  ctx.fillStyle='rgba(255,255,255,.75)';for(let x=X+R*.5;x<X+BW-R*.5;x+=cs*.18)ctx.fillRect(x,Y+h-cs*.2,cs*.09,cs*.08);
  if(k>.98){ // closed: stitched border, straps and a heart sticker
    ctx.save();ctx.setLineDash([cs*.13,cs*.11]);ctx.lineWidth=Math.max(1.5,cs*.05);ctx.strokeStyle='rgba(255,255,255,.65)';
    ctx.beginPath();rr(X+pad*.32,Y+pad*.32,BW-pad*.64,BH-pad*.64,R*.7);ctx.stroke();ctx.restore();
    ctx.fillStyle=t.dark;for(const sx of [X+BW*.27,X+BW*.73]){ctx.beginPath();rr(sx-cs*.2,Y,cs*.4,BH,cs*.1);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();rr(sx-cs*.26,Y+BH*.62,cs*.52,cs*.4,cs*.12);ctx.fill();ctx.fillStyle=t.dark}
    const hx=X+BW/2,hy=Y+BH*.45,kk=Math.min(BW,BH)*.12;ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(hx,hy+kk*1.1);
    ctx.bezierCurveTo(hx-kk*1.9,hy-kk*.2,hx-kk*.9,hy-kk*1.6,hx,hy-kk*.55);ctx.bezierCurveTo(hx+kk*.9,hy-kk*1.6,hx+kk*1.9,hy-kk*.2,hx,hy+kk*1.1);ctx.fill();
  }
  ctx.restore();
  // zipper pull
  if(k<.99){const zx=X+BW*k,zy=Y+h-cs*.16;ctx.fillStyle='#fff';ctx.beginPath();rr(zx-cs*.12,zy-cs*.06,cs*.24,cs*.42,cs*.12);ctx.fill();ctx.fillStyle=t.dark;ctx.beginPath();ctx.arc(zx,zy+cs*.24,cs*.05,0,TAU);ctx.fill()}
}
function puff(p){const [w,h]=dims(p.cells);for(let i=0;i<10;i++){const a=Math.random()*TAU,v=cs*(1.2+Math.random()*1.4);
  fx.push({x:bx+(p.gx+w/2)*cs,y:by+(p.gy+h/2)*cs,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:cs*(.06+Math.random()*.07),life:.55,max:.55,c:'#ffffff',g:0,star:false})}}
function confetti(){const X=bx+L.w*cs/2,Y=by-cs*.5;for(let i=0;i<60;i++){const a=-Math.PI/2+(Math.random()-.5)*2.2,v=cs*(5+Math.random()*7);
  fx.push({x:X,y:Y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:cs*(.08+Math.random()*.1),life:1.6+Math.random(),max:2.6,c:PC[i%PC.length][0],g:cs*9,star:i%3===0,sp:Math.random()*6})}}
function star(x,y,r){ctx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,q=i%2?r*.5:r;ctx.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}ctx.closePath()}

let last=0;
function frame(ts2){
  const now=ts2/1000,dt=Math.min(.05,last?now-last:0);last=now;clock=now;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,theme.bg[0]);g.addColorStop(1,theme.bg[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const M=Math.min(W,H);
  for(const b of bubbles){b.y-=b.v*dt;if(b.y<-.2){b.y=1.2;b.x=Math.random()}
    ctx.fillStyle=PC[b.c][0]+'22';ctx.beginPath();ctx.arc(b.x*W+Math.sin(now*.3+b.c)*20,b.y*H,b.r*M,0,TAU);ctx.fill()}
  // tray rug
  ctx.fillStyle='rgba(255,255,255,.42)';ctx.beginPath();rr(trayR.x,trayR.y,trayR.w,trayR.h,28);ctx.fill();
  suitcase(now);
  if(ghost&&drag){ctx.save();ctx.translate(bx+ghost.gx*cs,by+ghost.gy*cs);shape(drag.p.cells,cs);ctx.fillStyle='rgba(255,255,255,.8)';ctx.fill();ctx.globalAlpha=.3;ctx.fillStyle=drag.p.col[0];ctx.fill();ctx.restore()}
  for(const p of pieces){
    if(p.appear<1){const before=p.appear;p.appear+=dt*3.2;if(before<0&&p.appear>=0)sfx.appear(p.k)}
    if(drag&&drag.p===p)drag.lift+=((drag.touch?cs*.85:0)-drag.lift)*Math.min(1,dt*14);
    const t=target(p),k=1-Math.exp(-dt*(drag&&drag.p===p?32:16));p.x+=(t.x-p.x)*k;p.y+=(t.y-p.y)*k;p.s+=(t.s-p.s)*k;
    p.ang*=Math.exp(-dt*16);if(Math.abs(p.ang)<.002)p.ang=0;p.bounce=Math.max(0,p.bounce-dt*3);p.wob=Math.max(0,p.wob-dt*3.5);
  }
  pieces.filter(p=>p.placed).forEach(p=>drawPiece(p,now));
  if(win){win.t+=dt;const LT=.7,k=Math.max(0,Math.min(1,win.t/LT));
    if(win.t>0&&!win.z){win.z=1;sfx.zip(LT)}
    if(win.t>=LT&&!win.c){win.c=1;sfx.clack();confetti();setTimeout(sfx.chime,120)}
    const kk=k<1?ease(k):1+Math.sin(Math.min(1,(win.t-LT)*3)*Math.PI)*.0;lid(kk);
    if(win.t>LT+.9&&!overlay)showMsg(CHEERS[li%CHEERS.length],`Trip ${li+1} is ready to go.`,'Next trip',()=>load(li+1));
  }
  pieces.filter(p=>!p.placed&&!(drag&&drag.p===p)).forEach(p=>drawPiece(p,now));
  if(drag)drawPiece(drag.p,now);
  for(const f of fx){f.life-=dt;f.vy+=f.g*dt;f.vx*=Math.exp(-dt*(f.g?1.2:5));f.vy*=Math.exp(-dt*(f.g?1.2:5));f.x+=f.vx*dt;f.y+=f.vy*dt;
    ctx.globalAlpha=Math.max(0,Math.min(1,f.life/f.max*2));ctx.fillStyle=f.c;
    if(f.star){star(f.x,f.y,f.r*1.6);ctx.fill()}else{ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,TAU);ctx.fill()}}
  ctx.globalAlpha=1;fx=fx.filter(f=>f.life>0);
  requestAnimationFrame(frame);
}
addEventListener('resize',()=>layout(false));
if(window.visualViewport)visualViewport.addEventListener('resize',()=>layout(false));
load(Math.max(0,save.lvl|0));
requestAnimationFrame(frame);
</script>
