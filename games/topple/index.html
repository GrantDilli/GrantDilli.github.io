<!doctype html>
<html lang="en">
<head>
<script src="../site-glue.js" data-game="topple"></script>
<style>[data-fs]{display:none!important}body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input,textarea{-webkit-user-select:text;user-select:text}</style>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Topple: rolling block puzzle | Infinite Games</title><meta name="description" content="Roll a tall block across floating tiles and drop it upright into the hole. 56 levels of spatial puzzles, free in your browser."><link rel="canonical" href="https://grantdilli.github.io/games/topple/">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<style>
  main{max-width:640px;margin:0 auto;padding-block:24px 40px;display:grid;gap:12px;justify-items:center;text-align:center}
  h1{margin:0;font-family:var(--display);font-weight:700;color:var(--accent);font-size:2.4rem;letter-spacing:.01em;text-shadow:0 3px 0 #ffd0e5}
  .bar{display:flex;justify-content:space-between;gap:8px;width:100%;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
  .bar span{background:var(--panel);border-radius:999px;padding:2px 14px;box-shadow:0 3px 0 var(--line)}
  .bar b{color:var(--text);font-weight:800}
  .stage{position:relative;width:100%}
  canvas{display:block;background:#cfeaff;border:0;border-radius:28px;width:100%;aspect-ratio:4/3;touch-action:none;box-shadow:0 6px 0 rgba(123,92,255,.16),0 14px 34px rgba(80,60,160,.16)}
  .msg{position:absolute;inset:0;display:none;place-content:center;gap:12px;background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:28px;padding:16px}
  .msg.on{display:grid}
  .msg h2{margin:0;font-family:var(--display);font-weight:700;color:var(--accent);font-size:2.2rem;text-shadow:0 3px 0 #ffd0e5}
  .msg p{margin:0;color:var(--muted);font-weight:600}
  button{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:10px 22px;font:600 1rem var(--display);cursor:pointer;box-shadow:0 4px 0 var(--accent-dk);transition:transform .08s,box-shadow .08s}
  button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--accent-dk)}
  button.ghost{background:var(--panel);color:var(--text);box-shadow:0 4px 0 var(--ghost-dk)}
  button.ghost:active:not(:disabled){box-shadow:0 1px 0 var(--ghost-dk)}
  button:disabled{opacity:.4;cursor:default}
  .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .levels button{padding:6px 12px;min-width:42px}
  .levels button.cur{background:var(--sun);color:var(--text);box-shadow:0 4px 0 var(--sun-dk)}
  .tip{color:var(--text);font-weight:600;margin:0;min-height:1.5em}
  .back{justify-self:start;color:var(--muted)}
</style>
<link rel="stylesheet" href="fs.css">
<script src="fs.js" defer></script>
<style>
  /* Edge-to-edge: the game world is the whole screen; score and buttons float over it. */
  main.fs.full{position:relative;padding:0;gap:0;display:block}
  .full .stage{position:absolute;inset:0;min-height:0}
  .full canvas{border-radius:0;box-shadow:none}
  .full .msg{border-radius:0}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;
    padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left))}
  .hud .chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
  .chip{background:rgba(255,255,255,.88);color:var(--muted);font-weight:700;border-radius:999px;padding:4px 14px;box-shadow:0 3px 0 rgba(80,60,160,.15);white-space:nowrap;font-variant-numeric:tabular-nums}
  .chip b{color:var(--text);font-weight:800}
  .chip i{font-style:normal;margin-left:8px;opacity:.8}
  .hud .icons{display:flex;gap:8px;flex:none}
  .hud button,.hud .chip{pointer-events:auto}
  button.icon{width:44px;height:44px;padding:0;display:grid;place-items:center;background:rgba(255,255,255,.92);color:var(--text);box-shadow:0 4px 0 rgba(80,60,160,.2)}
  button.icon:active:not(:disabled){box-shadow:0 1px 0 rgba(80,60,160,.2)}
  button.icon svg{width:22px;height:22px}
  button.icon[hidden]{display:none}
  .full .tip{position:absolute;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));max-width:calc(100% - 24px);width:max-content;
    background:rgba(255,255,255,.88);border-radius:999px;padding:6px 18px;box-shadow:0 3px 0 rgba(80,60,160,.15);pointer-events:none;min-height:0}
  .full .tip:empty{display:none}
  @media (max-width:520px){.chip{padding:3px 11px;font-size:.9rem}.chip #lname{display:none}button.icon{width:40px;height:40px}.full .tip{font-size:.9rem;border-radius:18px;text-align:center;width:auto}}
</style>
</head>

// Each level cycles through a world: sky gradient, tile and slab colours, hole rim, ambient effect.
const THEMES=[
 {name:'Sunny Meadow',bg:['#7fd0ff','#d8f3ff'],tile:'#8ee39a',block:'#ff6fa8',rim:'#ffd23f',fx:'clouds',fxc:'#ffffff'},

// ---- sound: everything is synthesised with Web Audio, no files ----
const SND={on:true,ctx:null};
try{SND.on=localStorage.getItem('toppleSound')!=='off'}catch(e){}
function audio(){
  if(!SND.on)return null;
  if(!SND.ctx){try{const C=window.AudioContext||window.webkitAudioContext,a=new C();SND.ctx=a;
    SND.master=a.createGain();SND.master.gain.value=.55;SND.master.connect(a.destination);
    const dl=a.createDelay(),fb=a.createGain(),lp=a.createBiquadFilter(); // short echo gives a roomy tail
    dl.delayTime.value=.11;fb.gain.value=.22;lp.frequency.value=2200;
    SND.master.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(a.destination);
  }catch(e){SND.on=false;return null}}
  if(SND.ctx.state==='suspended')SND.ctx.resume();
  return SND.ctx}
function noiseBuf(a){if(!SND.nb){const b=a.createBuffer(1,a.sampleRate,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;SND.nb=b}return SND.nb}
function tone(type,f0,f1,dur,vol,when=0){const a=audio();if(!a)return;
  const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(SND.master);o.start(t);o.stop(t+dur+.02)}
function noise(freq,q,dur,vol,when=0,type='lowpass'){const a=audio();if(!a)return;
  const t=a.currentTime+when,src=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  src.buffer=noiseBuf(a);f.type=type;f.frequency.value=freq;f.Q.value=q;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(f);f.connect(g);g.connect(SND.master);src.start(t,Math.random()*.5);src.stop(t+dur+.02)}
const sfx={
  land(stand){const j=1+(Math.random()-.5)*.08; // standing up lands deeper and heavier
    tone('sine',(stand?95:140)*j,(stand?45:70)*j,stand?.22:.16,stand?.9:.6);
    noise(stand?700:1100,.7,.07,stand?.5:.35);tone('triangle',(stand?380:520)*j,(stand?300:420)*j,.05,.12)},
  click(){tone('square',1200,1200,.035,.1);tone('square',1800,1800,.05,.08,.045)},
  bridge(open){tone('sine',open?320:900,open?960:300,.28,.18,.06);tone('triangle',open?640:1400,open?1900:500,.22,.06,.09)},
  crack(){for(let i=0;i<5;i++)noise(2500+Math.random()*2000,3,.04,.45,i*.035,'bandpass');tone('sine',200,60,.3,.3,.05)},
  fall(){tone('sine',700,90,.9,.2);noise(500,1,.5,.1,.05)},
  win(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone('triangle',f,f,.45,.22,i*.08));
    tone('sine',2093,2093,.6,.06,.32);tone('sine',110,55,.5,.4)},
  spawn(){tone('sine',180,90,.12,.35);noise(900,.7,.05,.2)},
};
function setSound(on,init){SND.on=on;try{localStorage.setItem('toppleSound',on?'on':'off')}catch(e){}
  $('snd').innerHTML=on?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';$('snd').setAttribute('aria-pressed',on);if(on&&!init)audio()}

let save={unlocked:1,best:{}};
try{Object.assign(save,JSON.parse(localStorage.getItem('toppleSave'))||{})}catch(e){}
function persist(){try{localStorage.setItem('toppleSave',JSON.stringify(save))}catch(e){}}

function load(i){

function move(dx,dy){

  audio();

function land(){

function finish(){

// Rotate a point about the horizontal edge at coordinate c (x when d is along x, else y), z=0,

function drawBlock(pose){drawBox(pose.pts,pose.ns,theme.block,null,.16)}

      case'snow':p.y+=dt*(4e-5+p.r*6e-5);p.x+=Math.sin(t+p.p)*2e-4;r=.8+p.r*1.8;a=.85;break;
      case'bubbles':p.y-=dt*(3e-5+p.r*5e-5);p.x+=Math.sin(t*2+p.p)*3e-4;r=1.2+p.r*2.8;a=.45;break;

let last=performance.now();

// ---- UI ----
function ui(){
  $('lvl').textContent=li+1;$('lname').textContent=LEVELS[li].name;$('moves').textContent=moves;
  $('best').textContent=save.best[li]||'–';$('tip').textContent=LEVELS[li].tip||theme.name;
  const box=$('levels');if(!box)return;box.innerHTML='';
  LEVELS.forEach((l,i)=>{const b=document.createElement('button');b.textContent=i+1;b.className=i===li?'cur':'ghost';
    b.disabled=i>=save.unlocked;b.title=l.name;b.onclick=()=>load(i);box.appendChild(b)});
}
function showMsg(t,p,label,fn){overlay=true;$('mt').textContent=t;$('mp').textContent=p;const b=$('mb');b.textContent=label;b.onclick=fn;$('msg').classList.add('on');b.focus()}
function hideMsg(){overlay=false;$('msg').classList.remove('on')}
$('restart').onclick=()=>{if(!overlay){resetBlock();ui()}};
$('snd').onclick=()=>setSound(!SND.on);setSound(SND.on,true);
const KEYS={ArrowUp:[0,-1],ArrowRight:[1,0],ArrowDown:[0,1],ArrowLeft:[-1,0],w:[0,-1],d:[1,0],s:[0,1],a:[-1,0]};
addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(KEYS[k]){e.preventDefault();move(...KEYS[k])}
  else if(k==='r'&&!overlay){resetBlock();ui()}
  else if(k==='m')setSound(!SND.on);
  else if((k==='Enter'||k===' ')&&overlay){e.preventDefault();$('mb').click()}});
let touch=null;
cv.addEventListener('pointerdown',e=>{touch=[e.clientX,e.clientY]});
cv.addEventListener('pointerup',e=>{if(!touch)return;const sx=e.clientX-touch[0],sy=e.clientY-touch[1];touch=null;
  if(Math.hypot(sx,sy)<20)return;move(...(Math.abs(sx)>Math.abs(sy)?[Math.sign(sx),0]:[0,Math.sign(sy)]))});
addEventListener('resize',fit);
load(Math.min(save.unlocked-1,LEVELS.length-1));
requestAnimationFrame(frame);
</script>
</body>
</html>
