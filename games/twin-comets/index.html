<title>Twin Comets · Infinite Games</title>

<style>
  main{max-width:760px;margin:0 auto;padding-block:24px 40px;display:grid;gap:12px;justify-items:center;text-align:center}
  h1{margin:0;font-family:var(--display);font-weight:400;color:var(--lime);font-size:2.4rem}
  .bar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;width:100%;color:var(--muted);font-variant-numeric:tabular-nums}
  .bar b{color:var(--text)}
  .stage{position:relative;width:100%;user-select:none;-webkit-user-select:none}
  canvas{display:block;background:#0b0a12;border:2px solid var(--line);border-radius:6px;width:100%;aspect-ratio:16/10;touch-action:none;cursor:pointer}
  .msg{position:absolute;inset:0;display:none;place-content:center;gap:12px;background:rgba(11,10,18,.74);border-radius:6px;padding:16px}
  .msg.on{display:grid;animation:fade .25s ease-out}
  @keyframes fade{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.msg.on{animation:none}}
  .msg h2{margin:0;font-family:var(--display);font-weight:400;color:var(--lime);font-size:1.8rem}
  .msg.bad h2{color:var(--pink)}
  .msg p{margin:0;color:var(--muted);max-width:44ch;justify-self:center}
  .msg .stats{color:var(--text);font-variant-numeric:tabular-nums}
  button{background:var(--lime);color:var(--bg);border:0;border-radius:6px;padding:10px 20px;font:400 1rem var(--display);cursor:pointer}
  button.ghost{background:var(--panel);color:var(--text);border:2px solid var(--line)}
  .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
  .levels button{padding:6px 12px;min-width:40px}
  .levels button.done{border-color:var(--lime)}
  .levels button.cur{background:var(--pink);color:var(--bg);border-color:var(--pink)}
  .tip{color:var(--text);margin:0;min-height:1.5em}
  .back{justify-self:start;color:var(--muted)}
  .off{color:var(--muted);font-variant-numeric:tabular-nums;min-width:9ch}
  .small{font-size:.85rem;color:var(--muted);margin:0}
</style>
</head>

<main>
  <a class="back" href="../../index.html">← All games</a>

  <div class="row">

const $=id=>document.getElementById(id);
const TAU=Math.PI*2;
const hexA=(h,a)=>{const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`};
const mix=(h1,h2,k)=>{const a=parseInt(h1.slice(1),16),b=parseInt(h2.slice(1),16),f=(s)=>Math.round(((a>>s)&255)*(1-k)+((b>>s)&255)*k);return`rgb(${f(16)},${f(8)},${f(0)})`};
function rng(seed){let s=seed>>>0||1;return()=>(s=Math.imul(s^s>>>15,s|1)^(s+Math.imul(s^s>>>7,s|61)),((s^s>>>14)>>>0)/4294967296)}

// ---- turn a rhythm into a path of tiles ----
function parse(str){
  const ev=[];let s=1,mark=null,bar=0;
  for(const ch of str){
    if(ch===' ')continue;
    if(ch==='|'){if(Math.abs(bar-4)>1e-6)console.warn('bar adds to',bar,str);bar=0;continue}
    if(ch==='>'){s*=2;mark='up';continue}
    if(ch==='<'){s/=2;mark='down';continue}
    const d=ch==='T'?2/3:ch==='t'?1/3:+ch/4;
    if(!(d>0))throw Error('bad token '+ch);
    ev.push({d,s,mark});mark=null;bar+=d;
  }
  if(Math.abs(bar-4)>1e-6&&bar>0)console.warn('last bar adds to',bar);
  return ev;
}
function layout(L,li){
  const ev=parse(L.rhythm),n=ev.length+1;
  for(const e of ev){const th=e.d*Math.PI*e.s;if(th>=TAU-1e-6)throw Error('gap too long at spin '+e.s)}
  const R=rng(li*977+13);
  const pref=ev.map(()=>R()<L.twirl); // try a swirl first here?
  const P=[{x:0,y:0}],ain=[Math.PI],dirs=[];
  let budget=400000,minD=.8;
  function ok(i,q){ // tile i+1 would be at q; reject if it lands on or crosses the earlier path
    for(let j=0;j<i;j++){const p=P[j],dx=p.x-q.x,dy=p.y-q.y,dd=dx*dx+dy*dy;
      if(dd<(j===i-1?.3:minD*minD))return false}
    const a=P[i];
    for(let j=0;j<i-1;j++)if(cross(a,q,P[j],P[j+1]))return false;
    return true}
  function rec(i,dir){
    if(i===ev.length)return true;
    if(--budget<0)return false;
    const opts=pref[i]?[-dir,dir]:[dir,-dir];
    for(const d of opts){
      const th=ev[i].d*Math.PI*ev[i].s,ao=ain[i]+d*th,q={x:P[i].x+Math.cos(ao),y:P[i].y+Math.sin(ao)};
      if(Math.abs(th-Math.PI)<1e-6&&d!==opts[0])continue; // straight gaps look identical either way
      if(!ok(i,q))continue;
      P[i+1]=q;ain[i+1]=ao+Math.PI;dirs[i]=d;
      if(rec(i+1,d))return true;
    }
    P.length=i+1;return false}
  let solved=false;
  for(let tries=0;tries<4&&!solved;tries++){P.length=1;budget=400000;solved=rec(0,1);minD-=.08}
  if(!solved)console.warn('layout fell back for',L.name);
  // Build the tile list (fallback: straight line, never blocks play).
  const tiles=[];let beat=0,lastDir=1;
  for(let i=0;i<n;i++){
    const e=ev[i],p=P[i]||{x:i,y:0};
    const d=e?(dirs[i]??lastDir):lastDir;
    tiles.push({i,x:p.x,y:p.y,beat,ain:ain[i]??Math.PI,dir:d,s:e?e.s:(ev[i-1]?ev[i-1].s:1),
      swirl:i>0&&e&&d!==lastDir,mark:e?e.mark:null,cp:false,hitT:-1});
    if(e){beat+=e.d;lastDir=d}
  }
  // checkpoint at the first tile of every fourth bar
  for(let b=4;b*4<beat-4;b+=4){const t=tiles.find(t=>t.beat>=b*4-1e-6);if(t&&t!==tiles[0])t.cp=true}
  // melody: a walk over the scale that leans on chord tones
  const sc=SCALES[L.scale];let deg=7;
  tiles.forEach((t,i)=>{
    const ch=L.prog[Math.floor(t.beat/4)%L.prog.length],on=Math.abs(t.beat-Math.round(t.beat))<1e-6;
    const cands=[];for(let d=Math.max(4,deg-3);d<=Math.min(14,deg+3);d++){
      const rel=((d-ch)%7+7)%7,w=(rel===0||rel===2||rel===4)?(on?5:2):(on?.3:1);cands.push([d,w*(d===deg?.5:1)])}
    let tot=cands.reduce((s,c)=>s+c[1],0),r=R()*tot;for(const c of cands){r-=c[1];if(r<=0){deg=c[0];break}}
    if(i===tiles.length-1)deg=7+ch>14?ch:7+ch;
    t.midi=L.root+sc[deg%7]+12*Math.floor(deg/7);
  });
  return tiles;
}
function cross(a,b,c,d){
  const o=(p,q,r)=>(q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x);
  const d1=o(c,d,a),d2=o(c,d,b),d3=o(a,b,c),d4=o(a,b,d);
  return ((d1>1e-6&&d2<-1e-6)||(d1<-1e-6&&d2>1e-6))&&((d3>1e-6&&d4<-1e-6)||(d3<-1e-6&&d4>1e-6))}

// ---- sound: everything is synthesised with Web Audio, no files ----
const SND={on:true,ctx:null};
try{SND.on=localStorage.getItem('cometsSound')!=='off'}catch(e){}
function audio(){
  if(!SND.ctx){try{const C=window.AudioContext||window.webkitAudioContext,a=new C({latencyHint:'interactive'});SND.ctx=a;
    SND.master=a.createGain();SND.master.gain.value=SND.on?.6:0;
    const comp=a.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;
    SND.master.connect(comp);comp.connect(a.destination);
    const dl=a.createDelay(),fb=a.createGain(),lp=a.createBiquadFilter(),wet=a.createGain(); // echo for the hit notes

    const b=a.createBuffer(1,a.sampleRate,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;SND.nb=b;

function osc(dest,type,f0,f1,t,dur,vol,att=.004){const a=SND.ctx,o=a.createOscillator(),g=a.createGain();o.type=type;

  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.05);return o}

  kick(d,t){osc(d,'sine',150,42,t,.28,.95,.002);nz(d,'lowpass',900,.7,t,.025,.3)},
  snare(d,t){nz(d,'bandpass',1900,.8,t,.16,.42);osc(d,'triangle',210,150,t,.09,.22)},
  hat(d,t,acc){nz(d,'highpass',7500,.7,t,acc?.06:.035,acc?.16:.09)},
  click(d,t,hi){osc(d,'square',hi?1760:1320,hi?1760:1320,t,.05,.09)},
  bass(d,t,m,len){const a=SND.ctx,o=a.createOscillator(),f=a.createBiquadFilter(),g=a.createGain();o.type='sawtooth';o.frequency.value=mtof(m);

  pad(d,t,ms,len){const a=SND.ctx,f=a.createBiquadFilter(),g=a.createGain();f.type='lowpass';f.frequency.value=1100;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07,t+.25);g.gain.setValueAtTime(.07,t+len-.3);g.gain.linearRampToValueAtTime(0,t+len);

  pluck(t,m,pan){const a=SND.ctx,p=a.createStereoPanner?a.createStereoPanner():null,d=p||SND.fx;if(p){p.pan.value=pan;p.connect(SND.fx)}

};
const sfx={
  fail(){const a=audio();if(!a)return;const t=a.currentTime;osc(SND.fx,'sawtooth',420,70,t,.6,.18);nz(SND.fx,'lowpass',600,1,t,.4,.25)},
  win(root){const a=audio();if(!a)return;const t=a.currentTime;[0,4,7,12,16].forEach((s,i)=>osc(SND.fx,'triangle',mtof(root+12+s),mtof(root+12+s),t+i*.07,.8,.18));osc(SND.fx,'sine',mtof(root+36),mtof(root+36),t+.35,.9,.05)},
  tick(){const a=audio();if(!a)return;osc(SND.fx,'square',900,900,a.currentTime,.03,.05)},

function setSound(on){SND.on=on;try{localStorage.setItem('cometsSound',on?'on':'off')}catch(e){}
  $('snd').textContent=on?'Sound on (M)':'Sound off (M)';
  if(SND.master)SND.master.gain.setTargetAtTime(on?.6:0,SND.ctx.currentTime,.02)}

// ---- the clock: song time follows what the speakers are playing right now ----
let lastClock=0;
function clock(){let t;const a=SND.ctx;
  if(a){const ts=a.getOutputTimestamp?a.getOutputTimestamp():null;
    if(ts&&ts.performanceTime>0&&ts.contextTime>0)t=ts.contextTime+(performance.now()-ts.performanceTime)/1000;
    else t=a.currentTime-(a.outputLatency||a.baseLatency||0)}
  else t=performance.now()/1000;
  if(t<lastClock&&lastClock-t<.03)t=lastClock; // smooth tiny backward jitter
  return lastClock=t}

// ---- state ----
let save={best:{},done:{},offset:0};

const AUTO=/[?&]auto=1/.test(location.search);

let judge=[],meter=[],rings=[],early=[],pops=[],parts=[],trails=[[],[]],fx=[],cam={x:0,y:0,z:1},overlayT=null,idle0=performance.now()/1000;
const cache={};
const T=i=>t0+tiles[i].beat*spb;
function songBeat(now){return(now-t0)/spb}

function load(i){
  li=i;L=LEVELS[i];tiles=cache[i]||(cache[i]=layout(L,i));theme=THEMES[i%THEMES.length];spb=60/L.bpm;
  fx=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),r:Math.random(),p:Math.random()*TAU}));
  stopMusic();mode='ready';cur=0;cp=0;cpUses=0;judge=[];early=[];pops=[];parts=[];trails=[[],[]];failOrb=null;meter=[];rings=[];combo=0;
  tiles.forEach(t=>t.hitT=-1);
  cam.x=tiles[0].x;cam.y=tiles[0].y;
  ui();levelButtons();
  const b=save.best[li];
  showMsg(L.name,L.tip,`${L.bpm} BPM · ${tiles.length-1} beats to hit${b!=null?` · best ${b.toFixed(1)}%`:''}`,[['Play (Space)',()=>start(0)]]);

function start(from){

  tiles.forEach((t,i)=>{if(i>from)t.hitT=-1});
  cur=from;failOrb=null;pops=[];
  const now=clock(),lead=4*spb+.25;

let countFrom=0;
function stopMusic(){if(bus){const b=bus,a=SND.ctx;b.gain.setTargetAtTime(0,a.currentTime,.06);setTimeout(()=>b.disconnect(),600);bus=null}}
function schedule(){
  const a=SND.ctx;if(!a||!bus||(mode!=='count'&&mode!=='play'&&mode!=='win'))return;
  const ahead=a.currentTime+.15,sc=SCALES[L.scale],D=L.drums;
  while(step<lastStep&&t0+step/4*spb<ahead){
    const t=t0+step/4*spb,beat=step/4,k=((step%16)+16)%16,bar=Math.floor(beat/4);
    if(t>=a.currentTime-.01){
      if(beat<countFrom){ // count-in: clicks on the beat only
        if(k%4===0)inst.click(bus,t,beat>=countFrom-1);
      }else if(beat<tiles[tiles.length-1].beat+4-1e-6){
        const ch=L.prog[((bar%L.prog.length)+L.prog.length)%L.prog.length],chordM=[0,2,4].map(s=>L.root-12+sc[(ch+s)%7]+12*Math.floor((ch+s)/7));
        const intro=bar<1;
        if(D.k[k]==='x')inst.kick(bus,t);
        if(!intro&&D.s[k]==='x')inst.snare(bus,t);
        if(D.h[k]==='x')inst.hat(bus,t,k%4===2);
        if(!intro&&D.b[k]==='x')inst.bass(bus,t,chordM[0]-12+(k===14||k===6&&bar%2?7:0),spb*.45);
        if(k===0)inst.pad(bus,t,chordM.map(m=>m+12),spb*4);
      }
    }
    step++;
  }
}
setInterval(schedule,25);

function press(evT){
  if(mode==='ready'&&!$('msg').classList.contains('on')){start(0);return}
  if(mode==='ready'){start(0);return}
  if(mode==='fail'){if(performance.now()/1000-failAt>.45)start(cp);return}
  if(mode==='win'){if(performance.now()/1000-endAt>.8)next();return}
  if(mode!=='play'&&mode!=='count')return;
  const now=clock(),tp=now-(performance.now()-evT)/1000-save.offset/1000,nx=cur+1;
  if(nx>=tiles.length)return;
  const err=tp-T(nx),gap=T(nx)-T(cur),ew=Math.min(.14,.5*gap);
  if(err<-ew){
    if(mode==='count')return; // taps during the count-in don't count
    fail(now,'early');return}
  hit(nx,err,now);
}
function lateWin(i){return i+1<tiles.length?Math.min(.14,.5*(T(i+1)-T(i))):.14}
function hit(i,err,now){
  const t=tiles[i],ae=Math.abs(err);
  let k,txt,col;
  if(ae<=.045){k=0;txt='Perfect';col='#c6f432'}
  else if(ae<=.09){k=1;txt=err<0?'Early':'Late';col='#ffd166'}
  else{k=2;txt=err<0?'Early!':'Late!';col='#ff8a5c'}
  judge[i]=k;cur=i;t.hitT=now;
  combo=k<2?combo+1:0;bestCombo=Math.max(bestCombo,combo);
  meter.push({e:err,c:col,t:performance.now()/1000});if(meter.length>24)meter.shift();
  rings.push({x:t.x,y:t.y,c:i%2?theme.b:theme.a,t:performance.now()/1000});
  if(k)pop(i,txt,col);else if(i%4===0||i===tiles.length-1)pop(i,txt,col,.7);
  const c=i%2?theme.b:theme.a;
  for(let j=0;j<12;j++){const an=Math.random()*TAU,sp=.6+Math.random()*1.6;parts.push({x:t.x,y:t.y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,life:.5+Math.random()*.3,t:0,c})}
  if(t.cp)cp=i;
  const a=SND.ctx;if(a&&bus)inst.pluck(Math.max(a.currentTime,T(i)),t.midi,i%2?.35:-.35);
  if(i===tiles.length-1)win();

}
function pop(i,text,col,size=1){pops.push({x:tiles[i].x,y:tiles[i].y,text,col,t:performance.now()/1000,size})}
function fail(now,why='late'){
  mode='fail';failWhy=why;failAt=performance.now()/1000;sfx.fail();stopMusic();
  shake=1;flashA=.45;flashC='#ff3b5c';combo=0;
  if(tiles[cur+1])pop(cur+1,why==='early'?'Too early!':why==='pause'?'Paused':'Too late!','#ff5c6e',1.15);
  const t=tiles[cur],th=t.ain+t.dir*Math.PI*t.s*(now-T(cur))/spb,v=t.dir*Math.PI*t.s/spb;
  failOrb={x:t.x+Math.cos(th),y:t.y+Math.sin(th),vx:-Math.sin(th)*v,vy:Math.cos(th)*v,t:0,c:cur%2?theme.a:theme.b};
  setTimeout(()=>{if(mode!=='fail')return;
    const pct=Math.floor(100*cur/(tiles.length-1));
    showMsg(why==='early'?'Too early!':why==='pause'?'Paused':'Missed!',
      `${why==='early'?'You tapped before the comet reached the tile. ':why==='pause'?'The game stops when you leave the tab. ':'The comet flew past the tile. '}You made it ${pct}% of the way.`,
      cp?'Retry starts from the last checkpoint.':'Retry starts from the beginning.',
      [['Retry (Space)',()=>start(cp)]].concat(cp?[['Restart level',()=>start(0)]]:[]),why!=='pause')},700);
}
function accuracy(upto=cur){
  let s=0,n=0;for(let i=1;i<=upto;i++){if(judge[i]==null)continue;s+=[100,80,55][judge[i]];n++;n+=early[i]||0}
  return n?s/n:null}
function win(){
  mode='win';endAt=performance.now()/1000;sfx.win(L.root);flashA=.35;flashC='#ffffff';
  {const t=tiles[tiles.length-1];for(let j=0;j<60;j++){const an=Math.random()*TAU,sp=1+Math.random()*3.5;parts.push({x:t.x,y:t.y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,life:.8+Math.random()*.8,t:0,c:[theme.a,theme.b,'#ffffff'][j%3]})}}
  const acc=accuracy(),best=save.best[li];
  if(best==null||acc>best)save.best[li]=acc;save.done[li]=1;persist();
  const c=[0,0,0];judge.forEach(k=>{if(k!=null)c[k]++});
  setTimeout(()=>{if(mode!=='win')return;
    showMsg(li===LEVELS.length-1?'You beat them all!':'Level clear!',
      `${acc.toFixed(1)}% accuracy${best==null||acc>best?' · new best':''}${cpUses?` · ${cpUses} checkpoint retr${cpUses>1?'ies':'y'}`:''}`,
      `${c[0]} perfect · ${c[1]} close · ${c[2]} rough · best combo ${bestCombo}`,
      li<LEVELS.length-1?[['Next level (Space)',next],['Replay',()=>start(0)]]:[['Play again (Space)',()=>start(0)],['Level 1',()=>load(0)]])},1300);
  levelButtons();
}
function next(){if(li<LEVELS.length-1)load(li+1);else start(0)}

// ---- overlay + buttons ----
function showMsg(t,p,s,btns,bad=false){$('msg').classList.toggle('bad',bad);$('mt').textContent=t;$('mp').textContent=p;$('ms').textContent=s;const b=$('mbtns');b.innerHTML='';
  btns.forEach(([label,fn],i)=>{const e=document.createElement('button');e.textContent=label;if(i)e.className='ghost';
    e.onclick=ev=>{ev.stopPropagation();e.blur();fn()};b.appendChild(e)});$('msg').classList.add('on')}
function hideMsg(){$('msg').classList.remove('on')}
function ui(){$('lvl').textContent=li+1;$('lname').textContent=L.name;$('tip').textContent=L.tip;
  const a=accuracy();$('acc').textContent=a==null?'–':a.toFixed(1)+'%';
  const b=save.best[li];$('best').textContent=b==null?'–':b.toFixed(1)+'%'}
function levelButtons(){const box=$('levels');box.innerHTML='';
  LEVELS.forEach((lv,i)=>{const e=document.createElement('button');e.className='ghost'+(i===li?' cur':'')+(save.done[i]?' done':'');
    e.textContent=(save.done[i]?'★ ':'')+(i+1);e.title=lv.name;e.onclick=()=>{e.blur();load(i)};box.appendChild(e)})}
function setOffset(v){save.offset=Math.max(-200,Math.min(200,v));persist();$('off').textContent=`Offset ${save.offset>0?'+':''}${save.offset}ms`}
$('restart').onclick=e=>{e.currentTarget.blur();start(0)};
$('snd').onclick=e=>{e.currentTarget.blur();setSound(!SND.on)};
$('offDown').onclick=e=>{e.currentTarget.blur();setOffset(save.offset-10)};
$('offUp').onclick=e=>{e.currentTarget.blur();setOffset(save.offset+10)};
addEventListener('keydown',e=>{
  if(e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Tab')return;
  const k=e.key.toLowerCase();
  if(k==='r'){start(0);return}
  if(k==='m'){setSound(!SND.on);return}
  if(k==='escape'){if(mode!=='ready')load(li);return}
  if(e.target.tagName==='BUTTON'&&(k==='enter'||k===' ')&&mode!=='play'&&mode!=='count')return;
  e.preventDefault();press(e.timeStamp||performance.now());
});
$('c').addEventListener('pointerdown',e=>{e.preventDefault();press(e.timeStamp||performance.now())});
$('msg').addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;e.preventDefault();press(e.timeStamp||performance.now())});

// ---- drawing ----
const cv=$('c'),ctx=cv.getContext('2d');let W=0,H=0,DPR=1;
function fit(){DPR=Math.min(2,devicePixelRatio||1);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR)}
addEventListener('resize',fit);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(mode==='play'||mode==='count'))fail(clock(),'pause')});
let lastF=performance.now()/1000;
function frame(){
  const pf=performance.now()/1000,dt=Math.min(.05,pf-lastF);lastF=pf;
  if(cv.width!==Math.round(cv.getBoundingClientRect().width*DPR))fit();
  let now=clock();
  if(mode==='count'&&now>=T(cur)-1e-3)mode='play';
  if(mode==='play'||mode==='count'){
    if(AUTO)while(cur+1<tiles.length&&now>=T(cur+1)&&mode!=='win')hit(cur+1,0,now);
    if(mode==='play'&&cur+1<tiles.length&&now>T(cur+1)+lateWin(cur+1))fail(now);
  }
  schedule();
  draw(now,dt,pf);
  requestAnimationFrame(frame);
}
function orbAngle(now){const t=tiles[cur];
  if(mode==='ready')return t.ain+t.dir*Math.PI*(performance.now()/1000-idle0)/spb;
  if(mode==='win')return t.ain+t.dir*Math.PI*.5*(now-T(cur))/spb;
  return t.ain+t.dir*Math.PI*t.s*(now-T(cur))/spb}

  // background
  const g=X.createRadialGradient(W/2,H*.45,0,W/2,H*.45,Math.max(W,H)*.8);g.addColorStop(0,theme.bg[0]);g.addColorStop(1,theme.bg[1]);
  X.fillStyle=g;X.fillRect(0,0,W,H);
  X.fillStyle=hexA(cur%2?theme.b:theme.a,.05+.06*pulse);X.beginPath();X.arc(W/2,H/2,Math.min(W,H)*(.35+.03*pulse),0,TAU);X.fill();
  drawFx(pf,dt);
  // camera: follow the pivot, look a little ahead
  const U=Math.min(W,H)/6,ahead=tiles[Math.min(tiles.length-1,cur+3)],pv=tiles[cur];
  const tx=pv.x*.65+ahead.x*.35,ty=pv.y*.65+ahead.y*.35,k=1-Math.exp(-dt*4.5);
  cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;
  shake=Math.max(0,shake-dt*2.2);const shx=(Math.random()-.5)*shake*14,shy=(Math.random()-.5)*shake*14;
  const z=U*(1+.025*pulse*(mode==='play'?1:0)),sx=x=>(x-cam.x)*z+W/2+shx,sy=y=>(y-cam.y)*z+H/2+shy;
  // tiles
  const lo=Math.max(0,cur-24),hi=Math.min(tiles.length-1,cur+50);
  X.lineJoin='round';X.lineCap='butt';
  const seg=i=>{const t=tiles[i],p=tiles[i-1],n=tiles[i+1];
    const ax=p?(p.x+t.x)/2:t.x-(n.x-t.x)/2,ay=p?(p.y+t.y)/2:t.y-(n.y-t.y)/2;
    const bx=n?(n.x+t.x)/2:t.x+(t.x-p.x)/2,by=n?(n.y+t.y)/2:t.y+(t.y-p.y)/2;
    X.beginPath();X.moveTo(sx(ax),sy(ay));X.lineTo(sx(t.x),sy(t.y));X.lineTo(sx(bx),sy(by))};
  const alphaOf=i=>i<=cur?Math.max(0,1-(cur-i)/24)*.45:Math.max(0,1-Math.max(0,i-cur-30)/20);

    if(t.swirl&&i>cur){X.globalAlpha=al*.75;drawSwirl(x,y,z*.11,t.dir);X.globalAlpha=al}

    if(i===tiles.length-1){X.strokeStyle='#ffffff';X.lineWidth=3;X.globalAlpha=al*(.5+.5*pulse);X.beginPath();X.arc(x,y,z*.3,0,TAU);X.stroke()}
  }

  // orbit ring

  for(const p of parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.93;p.vy*=.93;const l=1-p.t/p.life;if(l<=0)continue;
    X.globalAlpha=l;X.fillStyle=p.c;X.beginPath();X.arc(sx(p.x),sy(p.y),Math.max(.5,z*.05*l),0,TAU);X.fill()}
  parts=parts.filter(p=>p.t<p.life);X.globalAlpha=1;X.globalCompositeOperation='source-over';

  if(mode==='fail'&&failOrb){const f=failOrb;f.t+=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;X.globalAlpha=Math.max(0,1-f.t/1.2);drawOrb(sx(f.x),sy(f.y),z,f.c,1);X.globalAlpha=1}

    X.fillText(p.text,sx(p.x),sy(p.y)-z*(.45+a*.35))}

    X.fillText(combo+' combo',12,24)}

    X.fillStyle=hexA('#000000',.3);X.fillRect(mx0,my0-5,mw,10);
    X.fillStyle=hexA('#c6f432',.25);X.fillRect(W/2-mw*.045/.28,my0-5,mw*.09/.28,10);
    X.fillStyle=hexA('#ffffff',.8);X.fillRect(W/2-1,my0-8,2,16);
    for(const m of meter){const a=1-(pf-m.t)/3;if(a<=0)continue;X.globalAlpha=a;X.fillStyle=m.c;X.fillRect(W/2+Math.max(-.14,Math.min(.14,m.e))/.28*mw-1.5,my0-6,3,12)}

function pushTrail(k,x,y,pf){const tr=trails[k];tr.push({x,y,t:pf});while(tr.length&&pf-tr[0].t>.16)tr.shift();

  X.fillStyle=g2;X.beginPath();X.arc(x,y,r,0,TAU);X.fill()}
function drawSwirl(x,y,r,dir){const X=ctx;X.strokeStyle='#ffffff';X.fillStyle='#ffffff';X.lineWidth=Math.max(2,r*.28);
  const a0=-2.4,a1=1.4;X.beginPath();X.arc(x,y,r,dir>0?a0:-a0,dir>0?a1:-a1,dir<0);X.stroke();
  const ae=dir>0?a1:-a1,hx=x+Math.cos(ae)*r,hy=y+Math.sin(ae)*r,tg=ae+dir*Math.PI/2,s=r*.6;
  X.beginPath();X.moveTo(hx+Math.cos(tg)*s,hy+Math.sin(tg)*s);X.lineTo(hx+Math.cos(tg+2.4)*s,hy+Math.sin(tg+2.4)*s);X.lineTo(hx+Math.cos(tg-2.4)*s,hy+Math.sin(tg-2.4)*s);X.closePath();X.fill()}
function drawSpeed(x,y,r,t){const X=ctx,up=t.mark==='up';X.strokeStyle=up?'#ff5c8a':'#5ad1ff';X.lineWidth=Math.max(2,r*.32);X.lineCap='round';
  const n=tiles[t.i+1]||t,a=Math.atan2(n.y-t.y,n.x-t.x);
  const ch=(o)=>{const cx=x+Math.cos(a)*o,cy=y+Math.sin(a)*o;X.beginPath();
    X.moveTo(cx+Math.cos(a+2.4)*r,cy+Math.sin(a+2.4)*r);X.lineTo(cx,cy);X.lineTo(cx+Math.cos(a-2.4)*r,cy+Math.sin(a-2.4)*r);X.stroke()};
  if(up){ch(-r*.25);ch(r*.45)}else ch(r*.1);X.lineCap='butt'}
function drawFx(pf,dt){const X=ctx,c=theme.fxc;
  const px=-cam.x*8,py=-cam.y*8;
  for(const f of fx){
    let x=((f.x*W+px*(.3+f.r))%W+W)%W,y=((f.y*H+py*(.3+f.r))%H+H)%H;
    switch(theme.fx){
      case'stars':X.fillStyle=hexA(c,.25+.35*Math.sin(pf*2+f.p)**2);X.fillRect(x,y,1+f.r*1.5,1+f.r*1.5);break;
      case'bubbles':f.y-=dt*(.02+.04*f.r);if(f.y<0)f.y+=1;X.strokeStyle=hexA(c,.25);X.lineWidth=1;X.beginPath();X.arc(x+Math.sin(pf+f.p)*4,y,2+f.r*4,0,TAU);X.stroke();break;
      case'fireflies':X.fillStyle=hexA(c,.15+.5*Math.max(0,Math.sin(pf*1.5+f.p)));X.beginPath();X.arc(x+Math.sin(pf*.5+f.p)*20,y+Math.cos(pf*.4+f.p)*14,1.5+f.r*1.5,0,TAU);X.fill();break;
      case'snow':f.y+=dt*(.02+.04*f.r);if(f.y>1)f.y-=1;X.fillStyle=hexA(c,.5);X.beginPath();X.arc(x+Math.sin(pf+f.p)*8,y,1+f.r*2,0,TAU);X.fill();break;
      case'embers':f.y-=dt*(.03+.06*f.r);if(f.y<0)f.y+=1;X.fillStyle=hexA(c,.3+.4*f.r);X.fillRect(x+Math.sin(pf*2+f.p)*6,y,2,2);break;
      case'sparkle':{const s=Math.max(0,Math.sin(pf*1.7+f.p*3));if(s>.2){X.strokeStyle=hexA(c,s*.6);X.lineWidth=1;const r=2+4*s*f.r;X.beginPath();X.moveTo(x-r,y);X.lineTo(x+r,y);X.moveTo(x,y-r);X.lineTo(x,y+r);X.stroke()}break}
      case'rain':f.y+=dt*(.5+.5*f.r);if(f.y>1)f.y-=1;X.strokeStyle=hexA(c,.22);X.lineWidth=1;X.beginPath();X.moveTo(x,y);X.lineTo(x-3,y+10+8*f.r);X.stroke();break;
    }
  }
}

setSound(SND.on);setOffset(save.offset||0);fit();
load(0);
requestAnimationFrame(frame);
</script>
